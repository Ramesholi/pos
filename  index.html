/* ============================================================
   नेपाली POS — Core App
   ============================================================ */

/* ---------- IndexedDB layer ---------- */
const DB_NAME = 'nepaliPOS_db', DB_VERSION = 1;
let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('products')){
        const s = d.createObjectStore('products', {keyPath:'id', autoIncrement:true});
        s.createIndex('category','category');
      }
      if(!d.objectStoreNames.contains('categories')){
        d.createObjectStore('categories', {keyPath:'id', autoIncrement:true});
      }
      if(!d.objectStoreNames.contains('sales')){
        const s = d.createObjectStore('sales', {keyPath:'id', autoIncrement:true});
        s.createIndex('date','date');
      }
      if(!d.objectStoreNames.contains('settings')){
        d.createObjectStore('settings', {keyPath:'key'});
      }
    };
    req.onsuccess = (e)=>{ db = e.target.result; resolve(db); };
    req.onerror = (e)=> reject(e.target.error);
  });
}
function storeTx(name, mode='readonly'){ return db.transaction(name, mode).objectStore(name); }
function dbGetAll(name){ return new Promise((res,rej)=>{ const r=storeTx(name).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbGet(name,id){ return new Promise((res,rej)=>{ const r=storeTx(name).get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbPut(name,val){ return new Promise((res,rej)=>{ const r=storeTx(name,'readwrite').put(val); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbDelete(name,id){ return new Promise((res,rej)=>{ const r=storeTx(name,'readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }
function dbClear(name){ return new Promise((res,rej)=>{ const r=storeTx(name,'readwrite').clear(); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }

/* ---------- App State ---------- */
const state = {
  tab: 'billing',
  products: [],
  categories: [],
  sales: [],
  cart: [],           // {productId,name,price,qty,unit}
  search: '',
  activeCategory: 'सबै',
  settings: {
    key:'main',
    shopName:'मेरो पसल',
    address:'', phone:'', pan:'',
    currency:'रु', taxRate:13,
    invoiceCounter: 1,
    matchThreshold: 0.72,
  },
  mobilenetModel: null,
  modelStatus: 'idle', // idle | loading | ready | error
  cameraMode: null,    // 'detect' | 'capture'
  editingProductId: null,
  lastSale: null,
  reportRange: 'today',
  cartOpen: false,

/* ---------- Utilities ---------- */
function toast(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 1800);
}
function formatMoney(num){
  num = Math.round((num||0)*100)/100;
  let sign = num < 0 ? '-' : '';
  num = Math.abs(num);
  let [intPart, decPart] = num.toFixed(2).split('.');
  let last3 = intPart.slice(-3);
  let rest = intPart.slice(0,-3);
  if(rest !== '') rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',';
  return sign + state.settings.currency + ' ' + rest + last3 + '.' + decPart;
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('ne-NP',{year:'numeric',month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString('ne-NP',{hour:'2-digit',minute:'2-digit'});
}
function uid(){ return Date.now() + Math.floor(Math.random()*1000); }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function cosineSim(a,b){
  let dot=0,na=0,nb=0;
  for(let i=0;i<a.length;i++){ dot+=a[i]*b[i]; na+=a[i]*a[i]; nb+=b[i]*b[i]; }
  if(na===0||nb===0) return 0;
  return dot/(Math.sqrt(na)*Math.sqrt(nb));
}
function resizeImageToDataURL(source, maxSize=320){
  const canvas = document.createElement('canvas');
  let w = source.videoWidth || source.width, h = source.videoHeight || source.height;
  let scale = Math.min(1, maxSize/Math.max(w,h));
  canvas.width = Math.round(w*scale); canvas.height = Math.round(h*scale);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
  return { dataURL: canvas.toDataURL('image/jpeg', 0.82), canvas };
}

/* ---------- Persistence bootstrap ---------- */
async function loadAll(){
  state.products = await dbGetAll('products');
  state.categories = await dbGetAll('categories');
  state.sales = await dbGetAll('sales');
  const s = await dbGet('settings','main');
  if(s) state.settings = Object.assign(state.settings, s);
  else await dbPut('settings', state.settings);
}
async function saveSettings(){ await dbPut('settings', state.settings); }

/* ============================================================
   RENDER ROOT
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(renderHeader());
  const main = el(`<div class="flex-1 overflow-y-auto pb-28"></div>`);
  if(state.tab==='billing') main.appendChild(renderBilling());
  if(state.tab==='products') main.appendChild(renderProducts());
  if(state.tab==='reports') main.appendChild(renderReports());
  if(state.tab==='settings') main.appendChild(renderSettings());
  app.appendChild(main);
  app.appendChild(renderBottomNav());
  if(state.tab==='billing') app.appendChild(renderCartBar());
}

function renderHeader(){
  const titles = { billing:'बिलिंग', products:'सामान व्यवस्थापन', reports:'बिक्री रिपोर्ट', settings:'सेटिङ' };
  const header = el(`
    <div class="safe-top sticky top-0 z-30">
      <div class="bg-ink text-paper px-4 pt-3 pb-3 flex items-center justify-between">
        <div>
          <div class="text-[11px] tracking-wide text-marigold font-medium">${state.settings.shopName || 'मेरो पसल'}</div>
          <div class="text-lg font-bold leading-tight">${titles[state.tab]}</div>
        </div>
        <div class="w-9 h-9 rounded-full bg-crimson flex items-center justify-center text-white font-bold num text-sm">
          ${(state.settings.shopName||'प').trim().slice(0,1)}
        </div>
      </div>
      <div class="prayer-strip"></div>
    </div>
  `);
  return header;
}

function renderBottomNav(){
  const items = [
    {id:'billing', label:'बिलिंग', icon:ICONS.bill},
    {id:'products', label:'सामान', icon:ICONS.box},
    {id:'reports', label:'रिपोर्ट', icon:ICONS.chart},
    {id:'settings', label:'सेटिङ', icon:ICONS.gear},
  ];
  const nav = el(`<div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto safe-bottom bg-white border-t border-[#E7E1D3] z-40"><div class="flex px-2"></div></div>`);
  const row = nav.querySelector('div');
  items.forEach(it=>{
    const btn = el(`<button class="nav-item ${state.tab===it.id?'active':''}">${it.icon}<span class="text-[11px] font-semibold">${it.label}</span></button>`);
    btn.onclick = ()=>{ state.tab = it.id; render(); };
    row.appendChild(btn);
  });
  return nav;
}

/* ============================================================
   BILLING TAB
   ============================================================ */
function renderBilling(){
  const wrap = el(`<div class="px-4 pt-4"></div>`);

  // Search + scan row
  const searchRow = el(`
    <div class="flex gap-2 mb-3">
      <div class="flex-1 flex items-center gap-2 bg-white rounded-2xl px-3 h-12 border border-[#E7E1D3]">
        <span class="text-[#9C9686]">${ICONS.search}</span>
        <input id="searchInput" type="text" placeholder="सामान खोज्नुहोस्..." class="flex-1 bg-transparent outline-none text-[15px]" value="${state.search}">
      </div>
      <button id="scanBtn" class="btn btn-primary w-12 h-12 shrink-0">${ICONS.camera}</button>
    </div>
  `);
  searchRow.querySelector('#searchInput').oninput = (e)=>{ state.search = e.target.value; refreshProductGrid(); };
  searchRow.querySelector('#scanBtn').onclick = ()=> openCamera('detect');
  wrap.appendChild(searchRow);

  // Category chips
  const cats = ['सबै', ...state.categories.map(c=>c.name)];
  const chipRow = el(`<div class="flex gap-2 overflow-x-auto pb-3 -mx-1 px-1"></div>`);
  cats.forEach(c=>{
    const chip = el(`<button class="tag whitespace-nowrap shrink-0 ${state.activeCategory===c?'bg-crimson text-white':'bg-white border border-[#E7E1D3] text-ink'}">${c}</button>`);
    chip.onclick = ()=>{ state.activeCategory = c; refreshProductGrid(); refreshChips(); };
    chipRow.appendChild(chip);
  });
  wrap.appendChild(chipRow);

  const grid = el(`<div id="productGrid" class="grid grid-cols-2 gap-3"></div>`);
  wrap.appendChild(grid);
  setTimeout(()=>{ refreshProductGrid(); }, 0);

  function refreshChips(){
    chipRow.querySelectorAll('button').forEach((b,i)=>{
      b.className = `tag whitespace-nowrap shrink-0 ${state.activeCategory===cats[i]?'bg-crimson text-white':'bg-white border border-[#E7E1D3] text-ink'}`;
    });
  }

  return wrap;
}

function filteredProducts(){
  let list = state.products;
  if(state.activeCategory && state.activeCategory!=='सबै') list = list.filter(p=>p.category===state.activeCategory);
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    list = list.filter(p => (p.name||'').toLowerCase().includes(q) || (p.nameEn||'').toLowerCase().includes(q));
  }
  return list;
}

function refreshProductGrid(){
  const grid = document.getElementById('productGrid');
  if(!grid) return;
  const list = filteredProducts();
  grid.innerHTML = '';
  if(list.length===0){
    grid.innerHTML = `<div class="col-span-2 text-center text-[#9C9686] py-14 text-sm">कुनै सामान फेला परेन।<br>तल्लो "सामान" ट्याबबाट थप्नुहोस्।</div>`;
    return;
  }
  list.forEach(p=>{
    const card = el(`
      <button class="card p-2.5 text-left active:scale-[0.97] transition-transform">
        <div class="w-full aspect-square rounded-xl overflow-hidden bg-[#F0EBDF] mb-2 flex items-center justify-center">
          ${p.photo ? `<img src="${p.photo}" class="w-full h-full object-cover">` : `<span class="text-[#C9C2AE]">${ICONS.image}</span>`}
        </div>
        <div class="text-[13.5px] font-semibold leading-tight line-clamp-2">${p.name}</div>
        <div class="flex items-center justify-between mt-1">
          <span class="num text-crimson font-bold text-[14px]">${formatMoney(p.price)}</span>
          <span class="text-[10.5px] ${p.stock<=(p.lowStock||3) ? 'text-crimson':'text-[#9C9686]'} num">स्टक: ${p.stock}</span>
        </div>
      </button>
    `);
    card.onclick = ()=> addToCart(p);
    grid.appendChild(card);
  });
}

function addToCart(p, qty=1){
  if(p.stock <= 0){ toast('स्टकमा छैन!'); return; }
  const existing = state.cart.find(c=>c.productId===p.id);
  if(existing){
    if(existing.qty + qty > p.stock){ toast('थप स्टक उपलब्ध छैन'); return; }
    existing.qty += qty;
  } else {
    state.cart.push({ productId:p.id, name:p.name, price:p.price, qty, unit:p.unit||'वटा' });
  }
  toast(`${p.name} थपियो`);
  render();
}

    const itemsWrap = sheet.querySelector('#cartItems');
    itemsWrap.innerHTML = '';

    const subtotal = state.cart.reduce((a,c)=>a+c.qty*c.price,0);

/* ---------- Checkout ---------- */
function openCheckout(){
  const subtotal = state.cart.reduce((a,c)=>a+c.qty*c.price,0);
  const root = document.getElementById('overlayRoot');
  const modal = el(`
    <div class="modal">
      <div class="modal-backdrop"></div>
      <div class="modal-box p-5">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-bold">भुक्तानी</h2>

        </div>

        <label class="text-xs font-semibold text-[#9C9686]">ग्राहकको नाम (वैकल्पिक)</label>
        <input id="custName" class="w-full mt-1 mb-3 h-11 rounded-xl border border-[#E7E1D3] px-3 outline-none" placeholder="ग्राहकको नाम">

        <label class="text-xs font-semibold text-[#9C9686]">छुट (%)</label>
        <input id="discountInp" type="number" min="0" max="100" value="0" class="w-full mt-1 mb-3 h-11 rounded-xl border border-[#E7E1D3] px-3 outline-none num" placeholder="0">

        <div class="flex items-center gap-2 mb-3">
          <label class="flex items-center gap-2 text-sm"><input id="taxToggle" type="checkbox" checked class="w-4 h-4 accent-crimson"> भ्याट लगाउनुहोस् (${state.settings.taxRate}%)</label>
        </div>

        <div class="text-xs font-semibold text-[#9C9686] mb-2">भुक्तानी विधि</div>
        <div class="grid grid-cols-3 gap-2 mb-4" id="payMethods">
          ${['नगद','ईसेवा/खल्ती','कार्ड'].map((m,i)=>`<button data-m="${m}" class="pm tag py-2.5 ${i===0?'bg-crimson text-white':'bg-[#F0EBDF] text-ink'}">${m}</button>`).join('')}
        </div>

        <div id="totalsBox" class="card p-4 space-y-1.5 mb-4 bg-[#F0EBDF]"></div>

        <button id="confirmPay" class="btn btn-primary w-full h-13 py-3.5 text-[15px]">${ICONS.check} बिल पूरा गर्नुहोस्</button>
      </div>
    </div>
  `);
  root.appendChild(modal);
  modal.querySelector('.modal-backdrop').onclick = ()=> modal.remove();
  modal.querySelector('#closeX').onclick = ()=> modal.remove();

  let payMethod = 'नगद';
  modal.querySelectorAll('.pm').forEach(b=>{
    b.onclick = ()=>{
      payMethod = b.dataset.m;
      modal.querySelectorAll('.pm').forEach(x=>x.className='pm tag py-2.5 bg-[#F0EBDF] text-ink');
      b.className='pm tag py-2.5 bg-crimson text-white';
    };
  });

  function computeTotals(){
    const discPct = parseFloat(modal.querySelector('#discountInp').value)||0;
    const useTax = modal.querySelector('#taxToggle').checked;
    const discAmt = subtotal * (discPct/100);
    const afterDisc = subtotal - discAmt;
    const taxAmt = useTax ? afterDisc * (state.settings.taxRate/100) : 0;
    const grand = afterDisc + taxAmt;
    return {subtotal, discAmt, taxAmt, grand};
  }
  function refreshTotals(){
    const t = computeTotals();
    modal.querySelector('#totalsBox').innerHTML = `
      <div class="flex justify-between text-sm"><span>सबटोटल</span><span class="num">${formatMoney(t.subtotal)}</span></div>
      <div class="flex justify-between text-sm text-leaf"><span>छुट</span><span class="num">-${formatMoney(t.discAmt)}</span></div>
      <div class="flex justify-between text-sm"><span>भ्याट (${state.settings.taxRate}%)</span><span class="num">${formatMoney(t.taxAmt)}</span></div>
      <div class="dashed pt-2 mt-1 flex justify-between text-base font-bold"><span>जम्मा रकम</span><span class="num text-crimson">${formatMoney(t.grand)}</span></div>
    `;
  }
  modal.querySelector('#discountInp').oninput = refreshTotals;
  modal.querySelector('#taxToggle').onchange = refreshTotals;
  refreshTotals();

  modal.querySelector('#confirmPay').onclick = async ()=>{
    const t = computeTotals();
    const custName = modal.querySelector('#custName').value.trim();
    await finalizeSale(t, payMethod, custName);
    modal.remove();
  };
}

async function finalizeSale(totals, payMethod, custName){
  const invoiceNo = state.settings.invoiceCounter;
  const sale = {
    invoiceNo,
    date: Date.now(),
    items: state.cart.map(c=>({...c})),
    subtotal: totals.subtotal,
    discount: totals.discAmt,
    tax: totals.taxAmt,
    total: totals.grand,
    payMethod, custName,
  };
  await dbPut('sales', sale);
  // reduce stock
  for(const c of state.cart){
    const p = state.products.find(pp=>pp.id===c.productId);
    if(p){ p.stock = Math.max(0, p.stock - c.qty); await dbPut('products', p); }
  }
  state.settings.invoiceCounter++;
  await saveSettings();
  await loadAll();
  state.cart = [];
  state.lastSale = sale;
  toast('बिल सफल भयो ✓');
  render();
  openReceipt(sale);
}

      price, costPrice: parseFloat(modal.querySelector('#fCost').value)||0,
      stock, unit: modal.querySelector('#fUnit').value,
      category, lowStock: parseInt(modal.querySelector('#fLowStock').value)||3,
      photo: currentPhoto, embedding: currentEmbedding,
    };
    if(isEdit) record.id = p.id;
    await dbPut('products', record);
    await loadAll();
    toast(isEdit ? 'अपडेट भयो ✓' : 'सामान थपियो ✓');
    modal.remove();
    render();
  };

  return modal;
}
function fileToImage(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

/* ============================================================
   CAMERA + AI DETECTION
   ============================================================ */
async function ensureModel(){
  if(state.modelStatus==='ready') return state.mobilenetModel;
  if(state.modelStatus==='loading'){
    await new Promise(res=>{ const iv=setInterval(()=>{ if(state.modelStatus!=='loading'){clearInterval(iv);res();} },200); });
    return state.mobilenetModel;
  }
  state.modelStatus='loading';
  try{
    if(typeof tf==='undefined' || typeof mobilenet==='undefined'){
      await new Promise((res)=>{ const iv=setInterval(()=>{ if(typeof tf!=='undefined' && typeof mobilenet!=='undefined'){clearInterval(iv);res();} },150); setTimeout(()=>{clearInterval(iv);res();},8000); });
    }
    state.mobilenetModel = await mobilenet.load({version:2, alpha:1.0});
    state.modelStatus='ready';
  }catch(err){
    console.error(err);
    state.modelStatus='error';
  }
  return state.mobilenetModel;
}
async function computeEmbedding(imgEl){
  const model = await ensureModel();
  if(!model) return null;
  const embTensor = model.infer(imgEl, true);
  const arr = await embTensor.data();
  embTensor.dispose();
  return Array.from(arr);
}

let cameraStream = null;
function openCamera(mode, onCapture){
  state.cameraMode = mode;
  const root = document.getElementById('overlayRoot');
  const modal = el(`
    <div class="modal p-0">
      <div class="modal-backdrop"></div>
      <div class="modal-box max-w-full w-full h-full max-h-full rounded-none bg-black flex flex-col">
        <div class="relative flex-1 flex items-center justify-center overflow-hidden">
          <video id="camVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
          <div class="scanbox"></div>
          <div id="camStatus" class="absolute top-5 left-0 right-0 text-center text-white text-sm font-medium px-6"></div>
          <button id="camClose" class="absolute top-5 right-4 w-10 h-10 rounded-full bg-black/50 text-white flex items-center justify-center">${ICONS.close}</button>
          <div id="loadingOverlay" class="absolute inset-0 bg-black/60 flex-col items-center justify-center gap-3 hidden">
            <div class="spinner"></div>
            <div class="text-white text-sm">बुद्धिमत्ता मोडेल लोड हुँदैछ...</div>
          </div>
        </div>
        <div class="p-5 flex flex-col items-center gap-3 bg-black safe-bottom">
          <div class="text-white/70 text-xs text-center">${mode==='detect' ? 'सामानलाई क्यामेरा अगाडि राखी क्याप्चर थिच्नुहोस्' : 'सामानको फोटो खिच्नुहोस्'}</div>
          <button id="captureBtn" class="w-16 h-16 rounded-full bg-white border-4 border-marigold active:scale-95 transition-transform"></button>
        </div>
      </div>
    </div>
  `);
  root.appendChild(modal);

  const video = modal.querySelector('#camVideo');
  const loadingOverlay = modal.querySelector('#loadingOverlay');
  const statusEl = modal.querySelector('#camStatus');

  navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment', width:{ideal:640}, height:{ideal:640} }, audio:false })
    .then(stream=>{ cameraStream = stream; video.srcObject = stream; })
    .catch(err=>{
      statusEl.textContent = 'क्यामेरा खोल्न सकिएन। अनुमति दिनुहोस्।';
      console.error(err);
    });

  function closeCamera(){
    if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream=null; }
    modal.remove();
  }
  modal.querySelector('#camClose').onclick = closeCamera;

  modal.querySelector('#captureBtn').onclick = async ()=>{
    if(!video.videoWidth){ toast('क्यामेरा तयार छैन'); return; }
    const {dataURL, canvas} = resizeImageToDataURL(video, 320);

    if(mode==='capture'){
      loadingOverlay.classList.remove('hidden'); loadingOverlay.classList.add('flex');
      statusEl.textContent='';
      const embedding = await computeEmbedding(canvas).catch(()=>null);
      loadingOverlay.classList.add('hidden'); loadingOverlay.classList.remove('flex');
      closeCamera();
      onCapture && onCapture(dataURL, embedding);
      return;
    }

    // detect mode: find best matching product
    loadingOverlay.classList.remove('hidden'); loadingOverlay.classList.add('flex');
    loadingOverlay.querySelector('div:last-child').textContent = 'सामान पहिचान हुँदैछ...';
    const withEmbeddings = state.products.filter(p=>p.embedding && p.embedding.length);
    if(withEmbeddings.length===0){
      loadingOverlay.classList.add('hidden');
      toast('कुनै सामानमा फोटो-पहिचान डाटा छैन। पहिले सामान थप्दा क्यामेराबाट फोटो लिनुहोस्।');
      return;
    }
    const embedding = await computeEmbedding(canvas).catch(()=>null);
    loadingOverlay.classList.add('hidden'); loadingOverlay.classList.remove('flex');
    if(!embedding){ toast('पहिचान असफल भयो'); return; }
    let best=null, bestScore=-1;
    withEmbeddings.forEach(p=>{
      const s = cosineSim(embedding, p.embedding);
      if(s>bestScore){ bestScore=s; best=p; }
    });
    if(best && bestScore >= state.settings.matchThreshold){
      closeCamera();
      confirmDialog(
        `"${best.name}" फेला पर्‍यो`,
        `मिल्दो: ${(bestScore*100).toFixed(0)}% — कार्टमा थप्ने हो?`,
        ()=> addToCart(best),
        'थप्नुहोस्'
      );
    } else {
      statusEl.textContent = best ? `पक्का पहिचान भएन (${(bestScore*100).toFixed(0)}% मिल्दो) — फेरि प्रयास गर्नुहोस्` : 'सामान फेला परेन';
    }
  };

  return modal;
}

function renderReports(){
  const wrap = el(`<div class="px-4 pt-4"></div>`);

  const ranges = [
    {id:'today', label:'आज'},
    {id:'yesterday', label:'हिजो'},
    {id:'week', label:'यो हप्ता'},
    {id:'month', label:'यो महिना'},
    {id:'all', label:'सबै'},
  ];
  const chipRow = el(`<div class="flex gap-2 overflow-x-auto mb-4"></div>`);
  ranges.forEach(r=>{
    const chip = el(`<button class="tag whitespace-nowrap shrink-0 ${state.reportRange===r.id?'bg-crimson text-white':'bg-white border border-[#E7E1D3]'}">${r.label}</button>`);
    chip.onclick = ()=>{ state.reportRange=r.id; render(); };
    chipRow.appendChild(chip);
  });
  wrap.appendChild(chipRow);

  const sales = filteredSales();
  const totalRevenue = sales.reduce((a,s)=>a+s.total,0);
  const txCount = sales.length;
  const avg = txCount ? totalRevenue/txCount : 0;

  wrap.appendChild(el(`
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="card p-4"><div class="text-[11px] text-[#9C9686] mb-1">कुल बिक्री</div><div class="num text-xl font-bold text-crimson">${formatMoney(totalRevenue)}</div></div>
      <div class="card p-4"><div class="text-[11px] text-[#9C9686] mb-1">जम्मा बिल</div><div class="num text-xl font-bold">${txCount}</div></div>
      <div class="card p-4"><div class="text-[11px] text-[#9C9686] mb-1">औसत बिल</div><div class="num text-xl font-bold">${formatMoney(avg)}</div></div>
      <div class="card p-4"><div class="text-[11px] text-[#9C9686] mb-1">कुल थान बिक्री</div><div class="num text-xl font-bold">${sales.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.qty,0),0)}</div></div>
    </div>
  `));

  // top products
  const qtyMap = {};
  sales.forEach(s=> s.items.forEach(it=>{ qtyMap[it.name] = (qtyMap[it.name]||0) + it.qty; }));
  const top = Object.entries(qtyMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(top.length){
    wrap.appendChild(el(`<div class="text-sm font-bold mb-2">धेरै बिक्री भएका सामान</div>`));
    const topWrap = el(`<div class="card p-3 mb-4 space-y-2"></div>`);
    const maxQ = top[0][1];
    top.forEach(([name,qty])=>{
      topWrap.appendChild(el(`
        <div>
          <div class="flex justify-between text-[13px] mb-1"><span>${name}</span><span class="num font-semibold">${qty}</span></div>
          <div class="h-2 rounded-full bg-[#F0EBDF] overflow-hidden"><div class="h-full bg-marigold" style="width:${(qty/maxQ*100)}%"></div></div>
        </div>
      `));
    });
    wrap.appendChild(topWrap);
  }

  wrap.appendChild(el(`<div class="text-sm font-bold mb-2">बिक्री विवरण</div>`));
  const list = el(`<div class="space-y-2"></div>`);
  if(sales.length===0){
    list.appendChild(el(`<div class="text-center text-[#9C9686] py-10 text-sm">यस अवधिमा बिक्री भएको छैन</div>`));
  }
  sales.sort((a,b)=>b.date-a.date).forEach(s=>{
    const row = el(`
      <button class="card p-3 w-full flex items-center justify-between text-left">
        <div>
          <div class="font-semibold text-[13.5px]">#${String(s.invoiceNo).padStart(4,'0')} ${s.custName?('· '+s.custName):''}</div>
          <div class="text-[11.5px] text-[#9C9686]">${fmtDate(s.date)} · ${s.payMethod}</div>
        </div>
        <div class="num font-bold text-crimson">${formatMoney(s.total)}</div>
      </button>
    `);
    row.onclick = ()=> openReceipt(s);
    list.appendChild(row);
  });
  wrap.appendChild(list);

  return wrap;
}
function filteredSales(){
  const now = new Date();
  const startOfDay = (d)=> new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  if(state.reportRange==='all') return [...state.sales];
  if(state.reportRange==='today'){
    const s0 = startOfDay(now);
    return state.sales.filter(s=>s.date>=s0);
  }
  if(state.reportRange==='yesterday'){
    const y = new Date(now); y.setDate(y.getDate()-1);
    const s0 = startOfDay(y), s1 = startOfDay(now);
    return state.sales.filter(s=>s.date>=s0 && s.date<s1);
  }
  if(state.reportRange==='week'){
    const w = new Date(now); w.setDate(w.getDate()-7);
    return state.sales.filter(s=>s.date>=w.getTime());
  }
  if(state.reportRange==='month'){
    const m = new Date(now.getFullYear(), now.getMonth(), 1);
    return state.sales.filter(s=>s.date>=m.getTime());
  }
  return state.sales;
}

async function exportData(){
  const data = {
    products: await dbGetAll('products'),
    categories: await dbGetAll('categories'),
    sales: await dbGetAll('sales'),
    settings: state.settings,
    exportedAt: Date.now(),
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `nepali-pos-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('ब्याकअप डाउनलोड भयो');
}
async function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    confirmDialog('डाटा फिर्ता ल्याउने?','हालको सबै डाटा बदलिनेछ।', async ()=>{
      await dbClear('products'); await dbClear('categories'); await dbClear('sales');
      for(const p of (data.products||[])) await dbPut('products', p);
      for(const c of (data.categories||[])) await dbPut('categories', c);
      for(const s of (data.sales||[])) await dbPut('sales', s);
      if(data.settings) { state.settings = Object.assign(state.settings, data.settings); await saveSettings(); }
      await loadAll();
      toast('डाटा फिर्ता ल्याइयो ✓');
      render();
    },'फिर्ता ल्याउनुहोस्');
  }catch(err){
    toast('फाइल पढ्न सकिएन');
  }
}

/* ============================================================
   Confirm dialog helper
   ============================================================ */
function confirmDialog(title, msg, onConfirm, confirmLabel='ठीक छ'){
  const root = document.getElementById('overlayRoot');
  const modal = el(`
    <div class="modal">
      <div class="modal-backdrop"></div>
      <div class="modal-box p-5 max-w-xs text-center">
        <div class="font-bold text-base mb-2">${title}</div>
        <div class="text-sm text-[#666] mb-5">${msg}</div>
        <div class="flex gap-2">
          <button id="cancelB" class="btn btn-ghost flex-1 h-11">रद्द</button>
          <button id="okB" class="btn btn-primary flex-1 h-11">${confirmLabel}</button>
        </div>
      </div>
    </div>
  `);
  root.appendChild(modal);
  modal.querySelector('.modal-backdrop').onclick=()=>modal.remove();
  modal.querySelector('#cancelB').onclick=()=>modal.remove();
  modal.querySelector('#okB').onclick=()=>{ modal.remove(); onConfirm(); };
}
