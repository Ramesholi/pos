<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>पसल POS — बिक्री व्यवस्थापन</title>
<meta name="theme-color" content="#0F1B33">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<style>
:root{
  --bg:#F3F5FA;
  --surface:#FFFFFF;
  --surface-alt:#F0F2F8;
  --ink:#181D2A;
  --muted:#6C7488;
  --border:#E6E9F2;
  --primary:#101B33;
  --primary-2:#1B2C52;
  --accent:#D63447;
  --accent-ink:#FFFFFF;
  --gold:#F1A93B;
  --success:#1B9C6E;
  --success-bg:#E7F8F1;
  --danger:#E23653;
  --danger-bg:#FDECEF;
  --info:#2C6BE0;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 6px 24px rgba(16,27,51,.08);
  --shadow-lg:0 18px 46px rgba(16,27,51,.16);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Inter','Noto Sans Devanagari',sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
h1,h2,h3,h4,.disp{font-family:'Sora','Noto Sans Devanagari',sans-serif;}
button{font-family:inherit;}
input,select,textarea{font-family:'Inter','Noto Sans Devanagari',sans-serif;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#D6DAE6;border-radius:8px;}
a{color:inherit;text-decoration:none;}

/* dhaka signature strip */
.dhaka-strip{
  height:7px;width:100%;
  background:
    linear-gradient(135deg, var(--gold) 25%, transparent 25%) 0 0/14px 14px,
    linear-gradient(-135deg, var(--accent) 25%, transparent 25%) 0 0/14px 14px,
    linear-gradient(45deg, var(--accent) 25%, transparent 25%) 0 0/14px 14px,
    linear-gradient(-45deg, var(--gold) 25%, transparent 25%) 0 0/14px 14px;
  background-color:#16233D;
  flex-shrink:0;
}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex-shrink:0;background:linear-gradient(180deg,var(--primary),var(--primary-2));
  color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 14px;}
.brand-badge{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;box-shadow:var(--shadow);overflow:hidden;flex-shrink:0;}
.brand-badge img{width:100%;height:100%;object-fit:cover;}
.brand-name{font-family:'Sora';font-weight:700;font-size:16.5px;line-height:1.15;}
.brand-sub{font-size:11px;color:#A9B4CC;margin-top:1px;}
.nav{padding:10px 12px;display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;color:#C7CFE3;cursor:pointer;font-size:14.5px;font-weight:500;transition:.15s;border:1px solid transparent;}
.nav-item i{font-size:19px;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.08);}
.nav-item.active i{color:var(--gold);}
.sidebar-foot{padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,.08);}
.lock-btn{display:flex;align-items:center;gap:10px;color:#C7CFE3;font-size:13.5px;cursor:pointer;padding:8px 10px;border-radius:10px;}
.lock-btn:hover{background:rgba(255,255,255,.06);color:#fff;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:14px 22px;gap:14px;
}
.topbar h1{font-size:19px;margin:0;font-weight:700;}
.topbar-sub{font-size:12.5px;color:var(--muted);margin-top:1px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);font-size:17px;}
.icon-btn:hover{background:var(--surface-alt);}
.topbar-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:none;align-items:center;justify-content:center;font-size:18px;font-weight:800;overflow:hidden;flex-shrink:0;}
.topbar-logo img{width:100%;height:100%;object-fit:cover;}
.content{padding:20px 22px 90px;flex:1;}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;transition:.15s;white-space:nowrap;}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(16,27,51,.08);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:#C22A3B;}
.btn-dark{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#20140a;}
.btn-success{background:var(--success);border-color:var(--success);color:#fff;}
.btn-outline{background:transparent;}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:9px;}
.btn-icon{padding:9px;border-radius:10px;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn-block{width:100%;justify-content:center;}

.input,.select{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--border);background:var(--surface-alt);font-size:14px;color:var(--ink);outline:none;transition:.15s;}
.input:focus,.select:focus{border-color:var(--accent);background:#fff;}
.label{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;display:block;}
.field{margin-bottom:14px;}
.row{display:flex;gap:12px;flex-wrap:wrap;}
.row>*{flex:1;min-width:140px;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
.chip-success{background:var(--success-bg);color:var(--success);}
.chip-danger{background:var(--danger-bg);color:var(--danger);}
.chip-gold{background:#FDF3E1;color:#9C6B10;}
.chip-info{background:#EAF1FE;color:var(--info);}
.muted{color:var(--muted);}
.divider{height:1px;background:var(--border);margin:14px 0;}
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr 1fr;}}

.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty i{font-size:42px;opacity:.35;display:block;margin-bottom:10px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1.5px solid var(--border);}
td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}

/* toast */
#toastHost{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{background:var(--primary);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;animation:toastIn .25s ease;}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--success);}
@keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(12,16,28,.55);backdrop-filter:blur(2px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{background:var(--surface);border-radius:20px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:modalIn .18s ease;}
.modal.wide{max-width:760px;}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);border-radius:20px 20px 0 0;z-index:2;}
.modal-head h3{margin:0;font-size:16.5px;}
.modal-body{padding:20px;}
.modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 20px 20px;}
.close-x{width:32px;height:32px;border-radius:9px;border:none;background:var(--surface-alt);cursor:pointer;font-size:16px;color:var(--muted);display:flex;align-items:center;justify-content:center;}

/* ---------- Lock Screen ---------- */
#lockScreen{position:fixed;inset:0;background:linear-gradient(160deg,var(--primary) 0%,#0A1226 100%);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:20px;}
.lock-badge{width:74px;height:74px;border-radius:22px;background:linear-gradient(135deg,var(--accent),var(--gold));display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:18px;box-shadow:0 10px 30px rgba(214,52,71,.4);overflow:hidden;}
.lock-badge img{width:100%;height:100%;object-fit:cover;}
.lock-title{font-family:'Sora';font-weight:700;font-size:20px;margin-bottom:2px;}
.lock-sub{color:#9AA6C4;font-size:13px;margin-bottom:26px;}
.pin-dots{display:flex;gap:14px;margin-bottom:26px;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid #4C577A;transition:.15s;}
.pin-dot.filled{background:var(--gold);border-color:var(--gold);}
.pin-dot.shake{animation:shake .35s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
.pin-pad{display:grid;grid-template-columns:repeat(3,68px);gap:14px;}
.pin-key{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:22px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.pin-key:hover{background:rgba(255,255,255,.14);}
.pin-key:active{background:rgba(255,255,255,.22);}
.pin-key.wide{background:transparent;border:none;font-size:19px;color:#9AA6C4;}

/* ---------- Dashboard ---------- */
.stat-card{padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;}
.stat-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.stat-val{font-family:'Sora';font-size:23px;font-weight:700;}
.stat-label{color:var(--muted);font-size:12.5px;font-weight:500;}
.stat-trend{font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:3px;}

/* ---------- POS ---------- */
.pos-wrap{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start;}
@media(max-width:980px){.pos-wrap{grid-template-columns:1fr;}}
.scan-bar{display:flex;gap:10px;margin-bottom:16px;}
.scan-bar .input{font-size:15px;}
.product-tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:8px;}
.product-tile:hover{border-color:var(--accent);box-shadow:0 6px 16px rgba(214,52,71,.12);transform:translateY(-2px);}
.product-tile.oos{opacity:.5;cursor:not-allowed;}
.p-thumb{width:100%;aspect-ratio:1.3;border-radius:10px;background:linear-gradient(135deg,#F0F2F8,#E4E8F3);display:flex;align-items:center;justify-content:center;font-size:26px;color:#AEB6CB;overflow:hidden;}
.p-thumb img{width:100%;height:100%;object-fit:cover;}
.p-name{font-size:12.5px;font-weight:700;line-height:1.25;}
.p-meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;}
.p-price{color:var(--accent);font-weight:800;font-size:13.5px;}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;}

.cart-panel{position:sticky;top:78px;display:flex;flex-direction:column;max-height:calc(100vh - 96px);}
.cart-head{padding:16px 16px 10px;display:flex;align-items:center;justify-content:space-between;}
.cart-list{flex:1;overflow-y:auto;padding:0 12px;max-height:320px;}
.cart-item{display:flex;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px dashed var(--border);}
.cart-item .ci-name{font-size:13px;font-weight:700;flex:1;min-width:0;}
.cart-item .ci-name div.sub{font-weight:500;color:var(--muted);font-size:11px;}
.qty-ctrl{display:flex;align-items:center;gap:6px;background:var(--surface-alt);border-radius:9px;padding:3px;}
.qty-ctrl button{width:24px;height:24px;border:none;background:#fff;border-radius:7px;cursor:pointer;font-weight:700;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}
.qty-ctrl span{width:22px;text-align:center;font-weight:700;font-size:13px;}
.ci-price{font-weight:700;font-size:13px;width:66px;text-align:right;}
.ci-del{color:var(--danger);cursor:pointer;font-size:16px;padding:2px;}
.cart-summary{padding:14px 16px;border-top:1px solid var(--border);}
.sum-row{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;color:var(--muted);}
.sum-row.total{font-size:18px;font-weight:800;color:var(--ink);padding-top:8px;border-top:1px dashed var(--border);margin-top:6px;}
.pay-types{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0;}
.pay-type{border:1.5px solid var(--border);border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;font-weight:700;cursor:pointer;color:var(--muted);}
.pay-type i{display:block;font-size:17px;margin-bottom:3px;}
.pay-type.active{border-color:var(--accent);color:var(--accent);background:#FDF1F2;}

/* ---------- receipt ---------- */
.receipt{width:300px;background:#fff;color:#111;font-family:'Inter',monospace;padding:18px 16px;margin:0 auto;font-size:12.5px;}
.receipt .r-head{text-align:center;margin-bottom:8px;}
.receipt .r-logo{width:46px;height:46px;border-radius:10px;margin:0 auto 6px;overflow:hidden;}
.receipt .r-logo img{width:100%;height:100%;object-fit:cover;}
.receipt .r-shop{font-family:'Sora';font-weight:800;font-size:16px;}
.receipt hr{border:none;border-top:1px dashed #999;margin:8px 0;}
.receipt table{font-size:11.5px;}
.receipt th,.receipt td{padding:3px 2px;border:none;}
.receipt .r-tot{display:flex;justify-content:space-between;font-weight:700;font-size:13.5px;}
.receipt .r-foot{text-align:center;margin-top:10px;color:#555;font-size:11px;}

/* scanner modal */
#qrReader{width:100%;border-radius:12px;overflow:hidden;background:#000;}

/* barcode label */
.label-preview{border:1.5px dashed var(--border);border-radius:12px;padding:14px;text-align:center;}

/* mobile bottom nav */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06);}
.bottom-nav .bn-items{display:flex;justify-content:space-around;}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10px;font-weight:600;padding:5px 8px;border-radius:10px;flex:1;}
.bn-item i{font-size:19px;}
.bn-item.active{color:var(--accent);}

.dash-2col{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;}
.dash-2col-even{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:860px){
  .sidebar{display:none;}
  .topbar-logo{display:flex;}
  .bottom-nav{display:block;}
  .content{padding:14px 14px 84px;}
  .topbar{padding:12px 14px;}
  .cart-panel{position:static;max-height:none;}
  .dash-2col, .dash-2col-even{grid-template-columns:1fr;}
  .g4{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:480px){
  .g4,.g3,.g2{grid-template-columns:1fr;}
  .pin-pad{grid-template-columns:repeat(3,58px);gap:10px;}
  .pin-key{width:58px;height:58px;font-size:19px;}
}
.hidden{display:none !important;}
.link-btn{background:none;border:none;color:var(--info);cursor:pointer;font-weight:700;font-size:12.5px;padding:0;}
.udhaaro-badge{display:inline-flex;align-items:center;gap:5px;background:var(--danger-bg);color:var(--danger);padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.avatar{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
.logo-upload-box{display:flex;align-items:center;gap:14px;}
.logo-preview{width:64px;height:64px;border-radius:14px;background:var(--surface-alt);border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--muted);overflow:hidden;flex-shrink:0;}
.logo-preview img{width:100%;height:100%;object-fit:cover;}
.report-toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
.report-toolbar .field{margin-bottom:0;min-width:150px;flex:1;}
.report-toolbar .btn{flex-shrink:0;}
.floating-cart-bar{position:fixed;left:16px;right:16px;bottom:16px;z-index:50;background:var(--primary);color:#fff;border-radius:16px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-lg);cursor:pointer;font-size:13.5px;font-weight:700;gap:10px;}
.floating-cart-bar .btn{pointer-events:none;}
@media(min-width:861px){.floating-cart-bar{left:246px;right:26px;bottom:22px;}}
@media(max-width:860px){.floating-cart-bar{bottom:74px;}}
.tag-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-alt);border:1px solid var(--border);padding:6px 10px;border-radius:20px;font-size:12.5px;font-weight:600;}
.tag-chip i{cursor:pointer;color:var(--muted);font-size:14px;}
.tag-chip i:hover{color:var(--danger);}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;top:0;left:0;width:100%;}
}
</style>
</head>
<body>

<div id="toastHost"></div>

<!-- ================= LOCK SCREEN ================= -->
<div id="lockScreen">
  <div class="lock-badge" id="lockBadge"><i class="ri-store-2-fill"></i></div>
  <div class="lock-title" id="lockTitle">पिन प्रविष्ट गर्नुहोस्</div>
  <div class="lock-sub" id="lockSub">आफ्नो पसल खोल्न ४ अंकको पिन हाल्नुहोस्</div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
  </div>
  <div class="pin-pad" id="pinPad">
    <button class="pin-key" data-k="1">1</button><button class="pin-key" data-k="2">2</button><button class="pin-key" data-k="3">3</button>
    <button class="pin-key" data-k="4">4</button><button class="pin-key" data-k="5">5</button><button class="pin-key" data-k="6">6</button>
    <button class="pin-key" data-k="7">7</button><button class="pin-key" data-k="8">8</button><button class="pin-key" data-k="9">9</button>
    <button class="pin-key wide" data-k="clear">खाली</button><button class="pin-key" data-k="0">0</button><button class="pin-key wide" data-k="back"><i class="ri-arrow-left-line"></i></button>
  </div>
</div>

<!-- ================= APP ================= -->

<!-- offscreen receipt render target for image capture -->
<div id="receiptCapture" style="position:fixed;left:-9999px;top:0;"></div>

<script>
/* ============================================================
   पसल POS — Vanilla JS + IndexedDB Point of Sale System
   ============================================================ */

/* ---------------- Utilities ---------------- */
const NPR = n => 'रु ' + (Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ const dt=new Date(d); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(d){ const dt=new Date(d); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' · '+dt.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}); }
function todayKey(){ return new Date().toISOString().slice(0,10); }
function toast(msg,type=''){
  const host=document.getElementById('toastHost');
  const t=document.createElement('div');
  t.className='toast '+type;
  const icon = type==='err'?'ri-error-warning-line':(type==='ok'?'ri-checkbox-circle-line':'ri-information-line');
  t.innerHTML=`<i class="${icon}"></i><span>${esc(msg)}</span>`;
  host.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateY(8px)'; t.style.transition='.2s'; setTimeout(()=>t.remove(),200); },2600);
}
function closeModal(){ const bg=document.querySelector('.modal-bg'); if(bg) bg.remove(); }
function openModalHTML(html){
  closeModal();
  const bg=document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML=html;
  bg.addEventListener('mousedown',e=>{ if(e.target===bg) closeModal(); });
  document.body.appendChild(bg);
  return bg;
}

/* ---------------- IndexedDB layer ---------------- */
let DB=null;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('pasal_pos_db', 1);
    req.onupgradeneeded=(e)=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('products')){
        const s=db.createObjectStore('products',{keyPath:'id'});
        s.createIndex('barcode','barcode',{unique:false});
        s.createIndex('name','name',{unique:false});
      }
      if(!db.objectStoreNames.contains('customers')){
        const s=db.createObjectStore('customers',{keyPath:'id'});
        s.createIndex('phone','phone',{unique:false});
      }
      if(!db.objectStoreNames.contains('sales')){
        const s=db.createObjectStore('sales',{keyPath:'id'});
        s.createIndex('date','date',{unique:false});
        s.createIndex('customerId','customerId',{unique:false});
      }
      if(!db.objectStoreNames.contains('transactions')){
        const s=db.createObjectStore('transactions',{keyPath:'id'});
        s.createIndex('customerId','customerId',{unique:false});
      }
      if(!db.objectStoreNames.contains('settings')){
        db.createObjectStore('settings',{keyPath:'key'});
      }
    };
    req.onsuccess=(e)=>{ DB=e.target.result; resolve(DB); };
    req.onerror=(e)=>{ reject(e); };
  });
}
function tx(store,mode='readonly'){ return DB.transaction(store,mode).objectStore(store); }
function dbGetAll(store){ return new Promise((res,rej)=>{ const r=tx(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbGet(store,key){ return new Promise((res,rej)=>{ const r=tx(store).get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbPut(store,val){ return new Promise((res,rej)=>{ const r=tx(store,'readwrite').put(val); r.onsuccess=()=>res(val); r.onerror=()=>rej(r.error); }); }
function dbDelete(store,key){ return new Promise((res,rej)=>{ const r=tx(store,'readwrite').delete(key); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }

/* ---------------- App State ---------------- */
const State = {
  view:'dashboard',
  products:[],
  customers:[],
  sales:[],
  transactions:[],
  settings:{ shopName:'मेरो पसल', shopAddr:'काठमाडौं, नेपाल', shopPhone:'', shopPan:'', shopLogo:'', vatPercent:13, pin:null, currency:'रु', categories:[], units:['थान','के.जी.','ग्राम','लिटर','मिली','प्याकेट','डजन'] },
  cart:[], // {productId,name,price,qty,barcode}
  selectedCustomerId:null,
  paymentType:'cash',
  discountPct:0,
  discountFlat:0,
  lastReceipt:null,
  pinBuffer:'',
  pinMode:'unlock', // unlock | setup | confirm | change-old | change-new
  pinTemp:null,
  html5Qr:null,
  scanContext:null // 'pos' | 'product-field'
};

const NAV_ITEMS=[
  {id:'dashboard', label:'ड्यासबोर्ड', icon:'ri-dashboard-3-line'},
  {id:'addcart', label:'सामान थप्नुहोस्', icon:'ri-shopping-basket-2-line'},
  {id:'billing', label:'बिलिङ', icon:'ri-shopping-cart-2-line'},
  {id:'products', label:'सामान', icon:'ri-archive-2-line'},
  {id:'customers', label:'ग्राहक', icon:'ri-team-line'},
  {id:'reports', label:'रिपोर्ट', icon:'ri-bar-chart-2-line'},
  {id:'settings', label:'सेटिङ', icon:'ri-settings-3-line'}
];

/* ---------------- Init ---------------- */
window.addEventListener('DOMContentLoaded', async ()=>{
  await openDB();
  await loadAll();
  buildNav();
  setupPinPad();
  applyBranding();
  if(!State.settings.pin){
    State.pinMode='setup';
    document.getElementById('lockTitle').textContent='नयाँ पिन बनाउनुहोस्';
    document.getElementById('lockSub').textContent='४ अंकको सुरक्षा पिन सेट गर्नुहोस्';
  } else {
    State.pinMode='unlock';
  }
});

async function loadAll(){
  const [products, customers, sales, transactions, settingsRows] = await Promise.all([
    dbGetAll('products'), dbGetAll('customers'), dbGetAll('sales'), dbGetAll('transactions'), dbGetAll('settings')
  ]);
  State.products=products||[];
  State.customers=customers||[];
  State.sales=sales||[];
  State.transactions=transactions||[];
  settingsRows.forEach(r=>{ State.settings[r.key]=r.value; });
}
async function saveSetting(key,value){ State.settings[key]=value; await dbPut('settings',{key,value}); }

/* ---------------- Branding (logo shown across app) ---------------- */
function applyBranding(){
  const logo=State.settings.shopLogo;
  const badgeHTML = logo ? `<img src="${logo}">` : '<i class="ri-store-2-fill"></i>';
  const badges=['sbBrandBadge','topbarLogo','lockBadge'];
  badges.forEach(id=>{ const el=document.getElementById(id); if(el) el.innerHTML=badgeHTML; });
  const nameEl=document.getElementById('sbShopName');
  if(nameEl) nameEl.textContent = State.settings.shopName || 'पसल POS';
}

/* ---------------- PIN / Lock ---------------- */
function setupPinPad(){
  document.querySelectorAll('.pin-key').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const k=btn.dataset.k;
      if(k==='clear'){ State.pinBuffer=''; renderPinDots(); return; }
      if(k==='back'){ State.pinBuffer=State.pinBuffer.slice(0,-1); renderPinDots(); return; }
      if(State.pinBuffer.length>=4) return;
      State.pinBuffer+=k;
      renderPinDots();
      if(State.pinBuffer.length===4) setTimeout(handlePinComplete,150);
    });
  });
}
function renderPinDots(){
  const dots=document.querySelectorAll('.pin-dot');
  dots.forEach((d,i)=>{ d.classList.toggle('filled', i<State.pinBuffer.length); });
}
function shakeDots(){
  const wrap=document.getElementById('pinDots');
  wrap.querySelectorAll('.pin-dot').forEach(d=>d.classList.add('shake'));
  setTimeout(()=>wrap.querySelectorAll('.pin-dot').forEach(d=>d.classList.remove('shake')),350);
}
async function handlePinComplete(){
  const val=State.pinBuffer;
  if(State.pinMode==='setup'){
    State.pinTemp=val;
    State.pinMode='confirm';
    State.pinBuffer='';
    renderPinDots();
    document.getElementById('lockTitle').textContent='पिन पुनः पुष्टि गर्नुहोस्';
    document.getElementById('lockSub').textContent='उही ४ अंकको पिन फेरि हाल्नुहोस्';
    return;
  }
  if(State.pinMode==='confirm'){
    if(val===State.pinTemp){
      await saveSetting('pin', val);
      toast('पिन सफलतापूर्वक सेट भयो','ok');
      unlockUI();
    } else {
      shakeDots(); toast('पिन मिलेन, फेरि प्रयास गर्नुहोस्','err');
      State.pinMode='setup'; State.pinBuffer=''; renderPinDots();
      document.getElementById('lockTitle').textContent='नयाँ पिन बनाउनुहोस्';
      document.getElementById('lockSub').textContent='४ अंकको सुरक्षा पिन सेट गर्नुहोस्';
    }
    return;
  }
  if(State.pinMode==='unlock'){
    if(val===State.settings.pin){
      unlockUI();
    } else {
      shakeDots(); toast('गलत पिन','err');
      State.pinBuffer=''; renderPinDots();
    }
    return;
  }
  if(State.pinMode==='change-old'){
    if(val===State.settings.pin){
      State.pinMode='change-new'; State.pinBuffer=''; renderPinDots();
      document.getElementById('lockTitle').textContent='नयाँ पिन हाल्नुहोस्';
      document.getElementById('lockSub').textContent='तपाईंको नयाँ पिन प्रविष्ट गर्नुहोस्';
    } else {
      shakeDots(); toast('गलत पिन','err');
      State.pinBuffer=''; renderPinDots();
    }
    return;
  }
  if(State.pinMode==='change-new'){
    await saveSetting('pin', val);
    toast('पिन परिवर्तन भयो','ok');
    unlockUI();
  }
}
function unlockUI(){
  document.getElementById('lockScreen').style.display='none';
  document.getElementById('app').classList.remove('hidden');
  State.pinBuffer=''; renderPinDots();
  navigate(State.view||'dashboard');
}
function lockApp(){
  State.pinMode='unlock'; State.pinBuffer='';
  document.getElementById('lockTitle').textContent='पिन प्रविष्ट गर्नुहोस्';
  document.getElementById('lockSub').textContent='आफ्नो पसल खोल्न ४ अंकको पिन हाल्नुहोस्';
  document.getElementById('lockScreen').style.display='flex';
  document.getElementById('app').classList.add('hidden');
  renderPinDots();
  if(State.html5Qr){ try{ State.html5Qr.stop(); }catch(e){} }
}
function startChangePin(){
  closeModal();
  State.pinMode='change-old'; State.pinBuffer='';
  document.getElementById('lockTitle').textContent='हालको पिन हाल्नुहोस्';
  document.getElementById('lockSub').textContent='पिन परिवर्तन गर्न पहिले हालको पिन प्रविष्ट गर्नुहोस्';
  document.getElementById('lockScreen').style.display='flex';
  document.getElementById('app').classList.add('hidden');
  renderPinDots();
}

/* ---------------- Nav / Router ---------------- */
function buildNav(){
  const nav=document.getElementById('navList');
  nav.innerHTML=NAV_ITEMS.map(n=>`<div class="nav-item" data-id="${n.id}" onclick="navigate('${n.id}')"><i class="${n.icon}"></i><span>${n.label}</span></div>`).join('');
  const bn=document.getElementById('bottomNavList');
  bn.innerHTML=NAV_ITEMS.map(n=>`<div class="bn-item" data-id="${n.id}" onclick="navigate('${n.id}')"><i class="${n.icon}"></i><span>${n.label}</span></div>`).join('');
}
async function navigate(view){
  State.view=view;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.id===view));
  document.querySelectorAll('.bn-item').forEach(el=>el.classList.toggle('active', el.dataset.id===view));
  const titles={dashboard:['ड्यासबोर्ड','आजको बिक्री सारांश'],addcart:['सामान थप्नुहोस्','सामान स्क्यान वा खोजी गरी कार्टमा थप्नुहोस्'],billing:['बिलिङ','कार्ट जाँची भुक्तानी लिई बिल बनाउनुहोस्'],products:['सामान व्यवस्थापन','आफ्नो स्टक व्यवस्थापन गर्नुहोस्'],customers:['ग्राहक व्यवस्थापन','ग्राहक र उधारो हेर्नुहोस्'],reports:['रिपोर्ट','बिक्री विश्लेषण'],settings:['सेटिङ','पसल र प्रणाली सेटिङ']};
  document.getElementById('pageTitle').textContent=titles[view][0];
  document.getElementById('pageSub').textContent=titles[view][1];
  applyBranding();
  const c=document.getElementById('content');
  c.innerHTML='<div class="empty">लोड हुँदै...</div>';
  if(view==='dashboard') renderDashboard();
  else if(view==='addcart') renderAddCart();
  else if(view==='billing') renderBilling();
  else if(view==='products') renderProducts();
  else if(view==='customers') renderCustomers();
  else if(view==='reports') renderReports();
  else if(view==='settings') renderSettings();
  window.scrollTo(0,0);
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDashboard(){
  const c=document.getElementById('content');
  const today=todayKey();
  const todaySales=State.sales.filter(s=>s.date.slice(0,10)===today);
  const todayRevenue=todaySales.reduce((a,s)=>a+s.total,0);
  const todayProfit=todaySales.reduce((a,s)=>a+(s.profit||0),0);
  const totalDue=State.customers.reduce((a,cu)=>a+(cu.dueAmount||0),0);
  const lowStock=State.products.filter(p=>p.stock<=(p.minStock||5));
  const totalStockValue=State.products.reduce((a,p)=>a+(p.stock*p.costPrice),0);

  const last7=[...Array(7)].map((_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-(6-i));
    const key=d.toISOString().slice(0,10);
    const total=State.sales.filter(s=>s.date.slice(0,10)===key).reduce((a,s)=>a+s.total,0);
    return {label:d.toLocaleDateString('en-GB',{weekday:'short'}), total};
  });

  const recentSales=[...State.sales].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  const topProducts=Object.values(State.sales.flatMap(s=>s.items).reduce((acc,it)=>{
    acc[it.productId]=acc[it.productId]||{name:it.name,qty:0,revenue:0};
    acc[it.productId].qty+=it.qty; acc[it.productId].revenue+=it.qty*it.price;
    return acc;
  },{})).sort((a,b)=>b.qty-a.qty).slice(0,5);

  c.innerHTML=`
    <div class="grid g4" style="margin-bottom:18px;">
      <div class="card stat-card">
        <div class="stat-icon" style="background:var(--success-bg);color:var(--success);"><i class="ri-money-rupee-circle-line"></i></div>
        <div class="stat-val">${NPR(todayRevenue)}</div>
        <div class="stat-label">आजको बिक्री (${todaySales.length} बिल)</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background:#EAF1FE;color:var(--info);"><i class="ri-line-chart-line"></i></div>
        <div class="stat-val">${NPR(todayProfit)}</div>
        <div class="stat-label">आजको नाफा</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background:var(--danger-bg);color:var(--danger);"><i class="ri-hand-coin-line"></i></div>
        <div class="stat-val">${NPR(totalDue)}</div>
        <div class="stat-label">कुल बाँकी उधारो</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background:#FDF3E1;color:#9C6B10;"><i class="ri-archive-2-line"></i></div>
        <div class="stat-val">${State.products.length}</div>
        <div class="stat-label">कुल सामान (${lowStock.length} कम स्टक)</div>
      </div>
    </div>

    <div class="dash-2col">
      <div class="card" style="padding:18px;">
        <h3 style="margin:0 0 14px;font-size:15px;">विगत ७ दिनको बिक्री</h3>
        <canvas id="salesChart" height="130"></canvas>
      </div>
      <div class="card" style="padding:18px;">
        <h3 style="margin:0 0 12px;font-size:15px;">बढी बिक्री हुने सामान</h3>
        ${topProducts.length? topProducts.map((p,i)=>`
          <div style="display:flex;align-items:center;gap:10px;padding:8px 0;${i<topProducts.length-1?'border-bottom:1px solid var(--border);':''}">
            <div class="avatar" style="background:linear-gradient(135deg,var(--accent),var(--gold));width:30px;height:30px;font-size:12px;">${i+1}</div>
            <div style="flex:1;min-width:0;">
              <div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(p.name)}</div>
              <div class="muted" style="font-size:11px;">${p.qty} थान बिक्री</div>
            </div>
            <div style="font-weight:700;font-size:12.5px;">${NPR(p.revenue)}</div>
          </div>`).join('') : `<div class="empty" style="padding:20px;"><i class="ri-bar-chart-line"></i>अझै बिक्री छैन</div>`}
      </div>
    </div>

    <div class="dash-2col-even" style="margin-top:18px;">
      <div class="card" style="padding:18px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h3 style="margin:0;font-size:15px;">हालैका बिलहरू</h3>
          <span class="link-btn" onclick="navigate('reports')">सबै हेर्नुहोस्</span>
        </div>
        ${recentSales.length? recentSales.map(s=>{ const st=getSaleStatus(s); return `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);gap:8px;">
            <div>
              <div style="font-weight:700;font-size:13px;">#${s.billNo}</div>
              <div class="muted" style="font-size:11px;">${fmtDateTime(s.date)}</div>
            </div>
            <div style="text-align:right;">
              <div style="font-weight:700;font-size:13px;">${NPR(s.total)}</div>
              <span class="chip ${st.cls}">${st.label}</span>
            </div>
            <div style="display:flex;gap:4px;flex-shrink:0;">
              <button class="btn btn-sm btn-icon" title="हेर्नुहोस्/सम्पादन" onclick="openSaleDetail('${s.id}')"><i class="ri-edit-line"></i></button>
              <button class="btn btn-sm btn-icon" title="WhatsApp पठाउनुहोस्" onclick="resendSaleWhatsApp('${s.id}')"><i class="ri-whatsapp-line" style="color:#25D366;"></i></button>
            </div>
          </div>`; }).join('') : `<div class="empty" style="padding:20px;"><i class="ri-receipt-line"></i>अझै बिल बनेको छैन</div>`}
      </div>
      <div class="card" style="padding:18px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h3 style="margin:0;font-size:15px;">कम स्टक चेतावनी</h3>
          <span class="link-btn" onclick="navigate('products')">व्यवस्थापन</span>
        </div>
        ${lowStock.length? lowStock.slice(0,6).map(p=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);">
            <div style="font-size:13px;font-weight:700;">${esc(p.name)}</div>
            <span class="chip chip-danger">${p.stock} बाँकी</span>
          </div>`).join('') : `<div class="empty" style="padding:20px;"><i class="ri-checkbox-circle-line"></i>सबै स्टक ठिक छ</div>`}
      </div>
    </div>
  `;
  const ctx=document.getElementById('salesChart');
  if(ctx && window.Chart){
    new Chart(ctx,{
      type:'bar',
      data:{ labels:last7.map(d=>d.label), datasets:[{ label:'बिक्री', data:last7.map(d=>d.total), backgroundColor:'#D63447', borderRadius:8, maxBarThickness:34 }] },
      options:{ plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, grid:{color:'#EEF0F6'} }, x:{ grid:{display:false} } } }
    });
  }
}
function payLabel(t){ return {cash:'नगद',card:'कार्ड',online:'अनलाइन',credit:'उधारो'}[t]||t; }
function getSaleStatus(sale){
  if(sale.paymentType!=='credit') return {label:'तिरिएको', cls:'chip-success', due:0};
  const paid=sale.paidAmount||0;
  const due=Math.max(0, sale.total-paid);
  if(due<=0) return {label:'तिरिएको', cls:'chip-success', due:0};
  if(paid>0) return {label:'आंशिक भुक्तानी', cls:'chip-gold', due};
  return {label:'बाँकी', cls:'chip-danger', due};
}

/* ============================================================
   PRODUCTS
   ============================================================ */
function renderProducts(){

async function saveProduct(id){
  const name=document.getElementById('pf_name').value.trim();
  const price=parseFloat(document.getElementById('pf_price').value);
  const cost=parseFloat(document.getElementById('pf_cost').value)||0;
  const stock=parseInt(document.getElementById('pf_stock').value);
  const minStock=parseInt(document.getElementById('pf_minstock').value)||5;
  let barcode=document.getElementById('pf_barcode').value.trim();
  const category=document.getElementById('pf_category').value.trim();
  const unit=document.getElementById('pf_unit').value;
  if(!name || isNaN(price) || isNaN(stock)){ toast('कृपया सबै आवश्यक फिल्ड भर्नुहोस्','err'); return; }
  if(!barcode) barcode=genBarcodeValue();
  const dupe=State.products.find(p=>p.barcode===barcode && p.id!==id);
  if(dupe){ toast('यो बारकोड पहिले नै अर्को सामानमा प्रयोग भएको छ','err'); return; }
  const rec = id ? State.products.find(p=>p.id===id) : {id:uid(), createdAt:new Date().toISOString()};
  Object.assign(rec,{name,price,costPrice:cost,stock,minStock,barcode,category,unit});
  await dbPut('products',rec);
  if(!id) State.products.push(rec);
  closeModal(); toast('सामान सुरक्षित भयो','ok');
  if(State.view==='products') renderProducts();
}
async function deleteProduct(id){
  if(!confirm('के तपाईं यो सामान मेटाउन चाहनुहुन्छ?')) return;
  await dbDelete('products',id);
  State.products=State.products.filter(p=>p.id!==id);
  toast('सामान मेटाइयो','ok'); renderProducts();
}

function openScannerModal(context){
  State.scanContext=context;
  openModalHTML(`
    <div class="modal">
      <div class="modal-head"><h3><i class="ri-camera-line"></i> बारकोड स्क्यान गर्नुहोस्</h3><button class="close-x" onclick="stopScannerAndClose()"><i class="ri-close-line"></i></button></div>
      <div class="modal-body">
        <div id="qrReader"></div>
        <p class="muted" style="text-align:center;margin-top:10px;font-size:12.5px;">क्यामेरालाई बारकोडमा राम्ररी देखाउनुहोस्। कम्प्युटरमा भए USB/ब्लुटुथ स्क्यानर पनि सिधै प्रयोग गर्न मिल्छ।</p>
      </div>
    </div>
  `);
  setTimeout(startCameraScanner, 150);
}
function startCameraScanner(){
  if(!window.Html5Qrcode){ toast('स्क्यानर लाइब्रेरी लोड हुन सकेन','err'); return; }
  State.html5Qr=new Html5Qrcode('qrReader');
  const config={ fps:12, qrbox:{width:250,height:150}, formatsToSupport:[
      Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E, Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.QR_CODE
  ]};
  Html5Qrcode.getCameras().then(cams=>{
    const camId = (cams.find(c=>/back|rear|environment/i.test(c.label))||cams[cams.length-1]||cams[0])?.id;
    if(!camId){ toast('क्यामेरा भेटिएन','err'); return; }
    State.html5Qr.start(camId, config, onScanDetected).catch(()=>{
      toast('क्यामेरा सुरु गर्न सकिएन, अनुमति जाँच्नुहोस्','err');
    });
  }).catch(()=> toast('क्यामेरा पहुँच अस्वीकृत भयो','err'));
}
function onScanDetected(text){
  if(State._scanLock) return; State._scanLock=true; setTimeout(()=>State._scanLock=false,1200);
  handleScannedBarcode(text);
}
function stopScannerAndClose(){
  if(State.html5Qr){ try{ State.html5Qr.stop().then(()=>State.html5Qr.clear()); }catch(e){} }
  closeModal();
}
function handleScannedBarcode(code){
  code=(code||'').trim();
  if(State.scanContext==='product-field'){
    const inp=document.getElementById('pf_barcode');
    stopScannerAndClose();
    setTimeout(()=>{ // reopen product form isn't trivial after modal replace; just toast + set if still around
      if(document.getElementById('pf_barcode')) document.getElementById('pf_barcode').value=code;
    },50);
    toast('बारकोड स्क्यान भयो: '+code,'ok');
  } else if(State.scanContext==='pos'){
    stopScannerAndClose();
    addProductByBarcode(code);
  } else if(State.scanContext==='product-lookup'){
    stopScannerAndClose();
    const p=State.products.find(x=>x.barcode===code);
    if(p) openProductModal(p.id);
    else { toast('नयाँ सामान — बारकोड सहित थप्नुहोस्','ok'); openProductModal(); setTimeout(()=>{ if(document.getElementById('pf_barcode')) document.getElementById('pf_barcode').value=code; },100); }
  }
}

/* Hardware keyboard-wedge scanner: listens globally while POS view active */
let hwBuffer=''; let hwTimer=null;
document.addEventListener('keydown', (e)=>{
  if(State.view!=='addcart') return;
  const active=document.activeElement;
  const typingInField = active && (active.tagName==='INPUT'||active.tagName==='TEXTAREA') && active.id!=='hwScanCatcher';
  if(typingInField) return;
  if(e.key==='Enter'){
    if(hwBuffer.length>=3){ handleScannedBarcode(hwBuffer); }
    hwBuffer=''; return;
  }
  if(e.key.length===1){
    hwBuffer+=e.key;
    clearTimeout(hwTimer);
    hwTimer=setTimeout(()=>{ hwBuffer=''; }, 300);
  }
});

function posSearchEnter(){
  const val=(document.getElementById('posSearch').value||'').trim();
  if(!val) return;
  const byBarcode=State.products.find(p=>p.barcode===val);

  const matches=State.products.filter(p=>p.name.toLowerCase().includes(val.toLowerCase()));
  if(matches.length===1){ addToCart(matches[0].id); document.getElementById('posSearch').value=''; filterPosGrid(); }

  if(!p){ toast('यो बारकोडको सामान भेटिएन','err'); return; }
  addToCart(p.id);

function addToCart(pid){
  const p=State.products.find(x=>x.id===pid);
  if(!p) return;
  if(p.stock<=0){ toast('स्टकमा छैन','err'); return; }
  const existing=State.cart.find(ci=>ci.productId===pid);
  const inCartQty = existing?existing.qty:0;
  if(inCartQty+1>p.stock){ toast('स्टक अपर्याप्त छ','err'); return; }
  if(existing) existing.qty+=1;
  else State.cart.push({productId:p.id,name:p.name,price:p.price,qty:1,unit:p.unit||'थान'});
  renderCart();
  updateFloatingCartBar();
  toast(p.name+' थपियो','ok');
}
function changeQty(pid,delta){
  const ci=State.cart.find(c=>c.productId===pid);
  const p=State.products.find(x=>x.id===pid);
  if(!ci) return;
  const newQty=ci.qty+delta;
  if(newQty<=0){ State.cart=State.cart.filter(c=>c.productId!==pid); }
  else if(p && newQty>p.stock){ toast('स्टक अपर्याप्त छ','err'); return; }
  else ci.qty=newQty;
  renderCart();
}
function removeFromCart(pid){ State.cart=State.cart.filter(c=>c.productId!==pid); renderCart(); updateFloatingCartBar(); }

function computeTotals(items, discountPct, discountFlat, vatPercent){
  const subtotal=items.reduce((a,c)=>a+c.price*c.qty,0);
  const pctOff=subtotal*((discountPct||0)/100);
  const discount=pctOff+(discountFlat||0);
  const taxable=Math.max(0, subtotal-discount);
  vatPercent=Number(vatPercent)||0;
  const vat=taxable*(vatPercent/100);
  const total=taxable+vat;
  const cost=items.reduce((a,c)=>{ const p=State.products.find(x=>x.id===c.productId); return a+(p?p.costPrice:0)*c.qty; },0);
  const profit=total-vat-cost;
  return {subtotal,discount,vat,vatPercent,total,profit};
}
function calcTotals(){
  return computeTotals(State.cart, State.discountPct, State.discountFlat, State.settings.vatPercent);
}
function renderCartSummary(){
  const el=document.getElementById('summaryBlock');
  if(!el) return;
  const {subtotal,discount,vat,vatPercent,total}=calcTotals();
  el.innerHTML=`
    <div class="sum-row"><span>उप-जम्मा</span><span>${NPR(subtotal)}</span></div>
    <div class="sum-row"><span>छुट</span><span>− ${NPR(discount)}</span></div>

    <div class="sum-row total"><span>कुल रकम</span><span>${NPR(total)}</span></div>
  `;
}

  State.paymentType=pt;

async function completeSale(){
  if(!State.cart.length){ toast('कार्टमा सामान छैन','err'); return; }
  if(State.paymentType==='credit' && !State.selectedCustomerId){ toast('उधारो बिलका लागि ग्राहक छनोट गर्नुपर्छ','err'); return; }
  const {subtotal,discount,vat,vatPercent,total,profit}=calcTotals();
  const billNo = 'B' + (State.sales.length+1).toString().padStart(5,'0');
  const sale={
    id:uid(), billNo, date:new Date().toISOString(),
    items: State.cart.map(c=>({productId:c.productId,name:c.name,price:c.price,qty:c.qty,unit:c.unit})),
    subtotal, discount, vat, vatPercent, total, profit,
    paymentType:State.paymentType,
    customerId: State.selectedCustomerId || null,
    paidAmount: State.paymentType==='credit' ? 0 : total
  };
  // deduct stock
  for(const ci of State.cart){
    const p=State.products.find(x=>x.id===ci.productId);
    if(p){ p.stock-=ci.qty; await dbPut('products',p); }
  }
  await dbPut('sales',sale);
  State.sales.push(sale);

  if(State.paymentType==='credit' && State.selectedCustomerId){
    const cu=State.customers.find(x=>x.id===State.selectedCustomerId);
    if(cu){
      cu.dueAmount=(cu.dueAmount||0)+total;
      await dbPut('customers',cu);
      const txn={id:uid(),customerId:cu.id,type:'sale',amount:total,date:new Date().toISOString(),note:'बिल #'+billNo,saleId:sale.id};
      await dbPut('transactions',txn); State.transactions.push(txn);
    }
  }

  State.lastReceipt=sale;
  toast('बिल सफलतापूर्वक बनाइयो','ok');
  State.cart=[]; State.discountPct=0; State.discountFlat=0; State.paymentType='cash';
  const custId=State.selectedCustomerId; State.selectedCustomerId=null;
  showReceipt(sale, custId);
  if(State.view==='billing') renderBilling(); else renderAddCart();
}

/* Bluetooth ESC/POS thermal printer (Web Bluetooth) */
async function bluetoothPrintReceipt(){
  if(!navigator.bluetooth){ toast('यो ब्राउजरले ब्लुटुथ समर्थन गर्दैन। Chrome (Android/Desktop) प्रयोग गर्नुहोस्।','err'); return; }
  try{
    const device=await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:['000018f0-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455','0000ffe0-0000-1000-8000-00805f9b34fb']
    });
    const server=await device.gatt.connect();
    const svcIds=['000018f0-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455','0000ffe0-0000-1000-8000-00805f9b34fb'];
    let writable=null;
    for(const sid of svcIds){
      try{
        const svc=await server.getPrimaryService(sid);
        const chars=await svc.getCharacteristics();
        writable=chars.find(c=>c.properties.write||c.properties.writeWithoutResponse) || null;
        if(writable) break;
      }catch(e){}
    }
    if(!writable){ toast('यो प्रिन्टरसँग मिल्ने सेवा भेटिएन','err'); return; }
    const sale=State.lastReceipt;
    const enc=new TextEncoder();
    let text='';
    text += (State.settings.shopName||'Pasal POS')+'\n';
    text += (State.settings.shopAddr||'')+'\n';
    text += 'Bill: '+sale.billNo+'  '+fmtDateTime(sale.date)+'\n';
    text += '--------------------------------\n';
    sale.items.forEach(it=>{ text += `${it.name} x${it.qty} = ${it.price*it.qty}\n`; });
    text += '--------------------------------\n';
    text += `TOTAL: Rs. ${sale.total}\n`;
    text += `Payment: ${sale.paymentType}\n\nDhanyabad!\n\n\n`;
    const bytes=enc.encode(text);
    const chunkSize=180;
    for(let i=0;i<bytes.length;i+=chunkSize){
      const chunk=bytes.slice(i,i+chunkSize);
      if(writable.properties.writeWithoutResponse) await writable.writeValueWithoutResponse(chunk);
      else await writable.writeValue(chunk);
      await new Promise(r=>setTimeout(r,60));
    }
    toast('प्रिन्टरमा पठाइयो','ok');
  }catch(e){
    toast('ब्लुटुथ प्रिन्ट असफल भयो: '+(e.message||'unknown'),'err');
  }
}

async function saveSaleEdit(saleId){
  const sale=State.sales.find(s=>s.id===saleId);
  if(!sale) return;
  const newItems=getSaleEditItems(saleId).filter(it=>it.qty>0);
  if(!newItems.length){ toast('कम्तिमा एउटा सामान हुनुपर्छ','err'); return; }
  const discFlat=parseFloat(document.getElementById('sei_disc').value)||0;
  const paytype=document.getElementById('sei_paytype').value;
  const custId=document.getElementById('sei_customer').value || null;
  if(paytype==='credit' && !custId){ toast('उधारोका लागि ग्राहक छनोट गर्नुपर्छ','err'); return; }

  // 1. reverse old stock deduction
  for(const it of sale.items){
    const p=State.products.find(x=>x.id===it.productId);
    if(p) p.stock += it.qty;
  }
  // 2. validate stock for new quantities
  for(const it of newItems){
    const p=State.products.find(x=>x.id===it.productId);
    if(p && it.qty>p.stock){
      for(const it2 of sale.items){ const p2=State.products.find(x=>x.id===it2.productId); if(p2) p2.stock -= it2.qty; }
      toast(`${it.name} को लागि पर्याप्त स्टक छैन`,'err');
      return;
    }
  }
  // 3. deduct new stock
  for(const it of newItems){
    const p=State.products.find(x=>x.id===it.productId);
    if(p) p.stock -= it.qty;
  }
  const affectedIds=new Set([...sale.items.map(i=>i.productId), ...newItems.map(i=>i.productId)]);
  for(const pid of affectedIds){
    const p=State.products.find(x=>x.id===pid);
    if(p) await dbPut('products',p);
  }

  // 4. reverse old customer due / transaction
  if(sale.paymentType==='credit' && sale.customerId){
    const oldCu=State.customers.find(x=>x.id===sale.customerId);
    if(oldCu){ oldCu.dueAmount=Math.max(0,(oldCu.dueAmount||0)-sale.total); await dbPut('customers',oldCu); }
    const oldTxn=State.transactions.find(t=>t.saleId===sale.id && t.type==='sale');
    if(oldTxn){ await dbDelete('transactions',oldTxn.id); State.transactions=State.transactions.filter(t=>t.id!==oldTxn.id); }
  }

  // 5. compute new totals
  const {subtotal,discount,vat,vatPercent,total,profit}=computeTotals(newItems,0,discFlat,State.settings.vatPercent);

  // 6. apply new customer due / transaction
  if(paytype==='credit' && custId){
    const newCu=State.customers.find(x=>x.id===custId);
    if(newCu){ newCu.dueAmount=(newCu.dueAmount||0)+total; await dbPut('customers',newCu); }
    const txn={id:uid(),customerId:custId,type:'sale',amount:total,date:sale.date,note:'बिल #'+sale.billNo+' (सम्पादित)',saleId:sale.id};
    await dbPut('transactions',txn); State.transactions.push(txn);
  }

  // 7. update sale record
  const newPaidAmount = paytype==='credit' ? Math.min(sale.paidAmount||0, total) : total;
  Object.assign(sale,{items:newItems,subtotal,discount,vat,vatPercent,total,profit,paymentType:paytype,customerId:paytype==='credit'?custId:null,paidAmount:newPaidAmount});
  await dbPut('sales',sale);

  closeModal();
  toast('बिल अपडेट भयो','ok');
  if(State.view==='reports') renderReportBody();
  else if(State.view==='dashboard') renderDashboard();
  else if(State.view==='customers') filterCustomersTable();
  else if(State.view==='products') renderProducts();
}
async function deleteSale(saleId){
  const sale=State.sales.find(s=>s.id===saleId);
  if(!sale) return;
  if(!confirm('के तपाईं यो बिल पूर्ण रूपमा मेटाउन चाहनुहुन्छ? स्टक र उधारो पनि समायोजन हुनेछ।')) return;
  for(const it of sale.items){
    const p=State.products.find(x=>x.id===it.productId);
    if(p){ p.stock += it.qty; await dbPut('products',p); }
  }
  if(sale.paymentType==='credit' && sale.customerId){
    const cu=State.customers.find(x=>x.id===sale.customerId);
    if(cu){ cu.dueAmount=Math.max(0,(cu.dueAmount||0)-sale.total); await dbPut('customers',cu); }
    const txn=State.transactions.find(t=>t.saleId===sale.id && t.type==='sale');
    if(txn){ await dbDelete('transactions',txn.id); State.transactions=State.transactions.filter(t=>t.id!==txn.id); }
  }
  await dbDelete('sales',saleId);
  State.sales=State.sales.filter(s=>s.id!==saleId);
  closeModal();
  toast('बिल मेटाइयो','ok');
  if(State.view==='reports') renderReportBody();
  else if(State.view==='dashboard') renderDashboard();
  else if(State.view==='customers') filterCustomersTable();
  else if(State.view==='products') renderProducts();
}

async function recordPayment(custId){
  const amt=parseFloat(document.getElementById('payAmt').value);
  if(!amt||amt<=0){ toast('मान्य रकम हाल्नुहोस्','err'); return; }
  const cu=State.customers.find(x=>x.id===custId);
  if(!cu) return;
  cu.dueAmount=Math.max(0,(cu.dueAmount||0)-amt);
  await dbPut('customers',cu);
  const txn={id:uid(),customerId:custId,type:'payment',amount:amt,date:new Date().toISOString(),note:'भुक्तानी प्राप्त'};
  await dbPut('transactions',txn); State.transactions.push(txn);

  // allocate this payment across the customer's outstanding credit bills, oldest first,
  // so each bill's paid/due status stays accurate
  let remaining=amt;
  const outstanding=State.sales
    .filter(s=>s.customerId===custId && s.paymentType==='credit' && (s.paidAmount||0)<s.total)
    .sort((a,b)=>a.date.localeCompare(b.date));
  for(const s of outstanding){
    if(remaining<=0) break;
    const due=s.total-(s.paidAmount||0);
    const pay=Math.min(due,remaining);
    s.paidAmount=(s.paidAmount||0)+pay;
    remaining-=pay;
    await dbPut('sales',s);
  }

  toast('भुक्तानी दर्ता भयो','ok');
  openLedger(custId);
  if(State.view==='customers') filterCustomersTable();
  if(State.view==='reports') renderReportBody();
  if(State.view==='dashboard') renderDashboard();
}
