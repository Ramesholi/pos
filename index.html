        <div class="field"><label>सेक्सन</label><select id="pf-section">${this.sectionOptions(u.class,u.section)}</select></div>
      </div>
      <div class="field"><label>फोन नम्बर</label><input type="text" id="pf-phone" value="${u.phone||''}"></div>
      <div class="field-row ${u.role==='student'?'hidden':''}" id="pf-login-wrap">
        <div class="field"><label>प्रयोगकर्ता नाम (लगइन)</label><input type="text" id="pf-username" value="${u.username||''}"></div>
        <div class="field"><label>पासवर्ड</label><input type="password" id="pf-password" value="${u.password||''}"></div>
      </div>
      <div class="field">
        <label>फोटो (अनुहार पहिचानको लागि) *</label>
        <div id="pf-photo-zone"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="closeModal()">रद्द</button>
        <button class="btn btn-primary" style="flex:1" onclick="PeopleUI.save()">${editing?'अपडेट गर्नुहोस्':'दर्ता गर्नुहोस्'} ✓</button>
      </div>
    `);
    this.onRoleChange();
    this.renderPhotoZone();
  },
  onRoleChange(){
    const role = $('#pf-role').value;
    $('#pf-class-wrap').classList.toggle('hidden', role!=='student');
    $('#pf-login-wrap').classList.toggle('hidden', role==='student');
  },
  onClassChange(){
    $('#pf-section').innerHTML = this.sectionOptions($('#pf-class').value, '');
  },
  renderPhotoZone(){
    const zone = $('#pf-photo-zone'); if(!zone) return;
    if(this.photoData){
      zone.innerHTML = `
        <div class="cam-wrap" style="max-width:220px;margin:0 auto;">
          <img class="cam-preview" src="${this.photoData}">
        </div>
        <div class="hint" style="text-align:center;">${this.faceDescriptor? '✅ अनुहार पहिचान भयो' : '⚠️ अनुहार फेला परेन — फेरि खिच्नुहोस् (छायाँ/उज्यालो मिलाउनुहोस्)'}</div>
        <button class="btn btn-outline btn-sm btn-block" style="margin-top:8px;" onclick="PeopleUI.photoData='';PeopleUI.faceDescriptor=null;PeopleUI.renderPhotoZone()">फेरि खिच्नुहोस्</button>`;
    } else {
      zone.innerHTML = `
        <div class="cam-wrap" style="max-width:220px;margin:0 auto;">
          <video id="pf-video" autoplay muted playsinline></video>
          <div class="cam-overlay-frame"></div>
        </div>
        <div class="cam-controls" style="margin-top:8px;">
          <button class="btn btn-outline btn-sm" onclick="Cam.flip($('#pf-video'))">🔄 अगाडि/पछाडि क्यामेरा</button>
          <button class="btn btn-primary btn-sm" onclick="PeopleUI.snap()">📸 फोटो खिच्नुहोस्</button>
        </div>
        <div class="hint" style="text-align:center; margin-top:4px;">वा <label style="color:var(--himal); font-weight:700; cursor:pointer;">फाइलबाट अपलोड <input type="file" accept="image/*" style="display:none" onchange="PeopleUI.uploadPhoto(event)"></label></div>`;
      Cam.start($('#pf-video'),'user');
    }
  },
  async snap(){
    const v = $('#pf-video'); if(!v) return;
    const data = Cam.snap(v);
    Cam.stop();
    await this.processPhoto(data);
  },
  async uploadPhoto(e){
    const f = e.target.files[0]; if(!f) return;
    const data = await fileToDataURL(f);
    await this.processPhoto(data);
  },
  async processPhoto(data){
    this.photoData = data;
    this.renderPhotoZone();
    toast('अनुहार पहिचान गर्दैछ...','info',1200);
    try{
      await Face.loadModels();
      const img = new Image(); img.src = data;
      await new Promise(r=>{ img.onload=r; });
      this.faceDescriptor = await Face.getDescriptor(img);
    }catch(e){ this.faceDescriptor = null; }
    this.renderPhotoZone();
  },
  async save(){
    const role = $('#pf-role').value;
    const name = $('#pf-name').value.trim();
    if(!name){ toast('नाम आवश्यक छ','error'); return; }
    if(!this.photoData){ toast('फोटो आवश्यक छ','error'); return; }
    const cls = role==='student' ? $('#pf-class').value : '';
    const sec = role==='student' ? $('#pf-section').value : '';
    const username = role!=='student' ? $('#pf-username').value.trim() : '';
    const password = role!=='student' ? $('#pf-password').value : '';

    const payload = {
      role, name, class:cls, section:sec, phone:$('#pf-phone').value.trim(),
      photo:this.photoData, faceDescriptor:this.faceDescriptor,
      username, password, status:'active'
    };
    if(this.editingId){
      const existing = await DB.getUser(this.editingId);
      Object.assign(existing, payload);
      await DB.putUser(existing);
      toast('अपडेट भयो','success');
    } else {
      payload.qrId = uid();
      payload.createdAt = new Date().toISOString();
      const id = await DB.addUser(payload);
      payload.id = id;
      toast('दर्ता सफल भयो! ID कार्ड हेर्न सक्नुहुन्छ।','success');
    }
    await loadState();
    closeModal();
    PeopleUI.render();
  },
  async remove(id){
    openModal(`
      <div class="modal-head"><h3>हटाउने पुष्टि</h3><button class="close-x" onclick="closeModal()">✕</button></div>
      <p>के तपाईं यो व्यक्तिलाई हटाउन निश्चित हुनुहुन्छ? हाजिर विवरण सुरक्षित रहनेछ।</p>
      <div class="btn-row"><button class="btn btn-outline" onclick="closeModal()">रद्द</button>
      <button class="btn btn-danger" style="flex:1" onclick="PeopleUI.confirmRemove(${id})">हटाउनुहोस्</button></div>
    `);
  },
  async confirmRemove(id){
    const u = await DB.getUser(id);
    u.status='inactive';
    await DB.putUser(u);
    await loadState();
    closeModal();
    toast('हटाइयो','success');
    PeopleUI.render();
  },
  async showIdCard(id){
    const u = await DB.getUser(id);
    const cfg = State.config;
    openModal(`
      <div class="modal-head"><h3>परिचय-पत्र</h3><button class="close-x" onclick="closeModal()">✕</button></div>
      <div class="idcard" id="idcard-print">
        <div class="idcard-head">
          <div class="sname">${cfg.schoolName}</div>
          <div class="saddr">${cfg.address||''}</div>
          <div class="idcard-ridge"><svg viewBox="0 0 340 26" preserveAspectRatio="none"><polygon points="0,26 0,16 30,6 60,14 100,3 140,13 170,5 200,15 230,7 260,16 290,6 320,14 340,9 340,26" fill="#FFFDF8"/></svg></div>
        </div>
        <div class="idcard-body">
          <div class="idcard-photo">${u.photo?`<img src="${u.photo}">`:''}</div>
          <div class="idcard-name">${u.name}</div>
          <div class="idcard-role">${ROLE_LABEL[u.role]}</div>
          <div class="idcard-meta">${u.class?`कक्षा: ${u.class} ${u.section}<br>`:''}${u.phone?`फोन: ${u.phone}`:''}</div>
          <div class="idcard-qr" id="idcard-qr-el"></div>
          <div class="idcard-id">${u.qrId}</div>
        </div>
      </div>
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn btn-outline" style="flex:1" onclick="closeModal()">बन्द गर्नुहोस्</button>
        <button class="btn btn-primary" style="flex:1" onclick="PeopleUI.printCard()">🖨️ प्रिन्ट / डाउनलोड</button>
      </div>
    `);
    QR.renderInto('idcard-qr-el', u.qrId);
  },
  printCard(){
    const card = $('#idcard-print');
    const w = window.open('', '_blank');
    w.document.write(`<html><head><title>ID Card</title><style>
      body{font-family:sans-serif; display:flex; justify-content:center; padding:40px; background:#eee;}
      </style></head><body>${card.outerHTML}</body></html>`);
    w.document.close();
    setTimeout(()=>w.print(), 400);
  }
};
</script>
<script>
/* ---------------------------- Reports view ---------------------------- */
Views.reports = function(main){
  const now = new Date();
  main.innerHTML = `
    <div class="card">
      <div class="card-title">हाजिर रिपोर्ट</div>
      <div class="card-sub">दैनिक, मासिक र वार्षिक हाजिर हेर्नुहोस् र एक्सेलमा डाउनलोड गर्नुहोस्</div>
      <div class="tabs">
        <button class="tab-btn active" id="rt-daily" onclick="ReportsUI.switchTab('daily')">दैनिक</button>
        <button class="tab-btn" id="rt-monthly" onclick="ReportsUI.switchTab('monthly')">मासिक</button>
        <button class="tab-btn" id="rt-yearly" onclick="ReportsUI.switchTab('yearly')">वार्षिक</button>
      </div>
      <div class="grid grid-3" id="rt-filters"></div>
      <div class="btn-row" style="margin-bottom:12px;">
        <button class="btn btn-gold btn-sm" onclick="ReportsUI.exportExcel()">⬇️ एक्सेल डाउनलोड</button>
      </div>
      <div id="rt-body"></div>
    </div>
  `;
  ReportsUI.year = now.getFullYear();
  ReportsUI.month = now.getMonth()+1;
  ReportsUI.date = todayStr();
  ReportsUI.klass = 'all';
  ReportsUI.switchTab('daily');
};

const ReportsUI = {
  tab:'daily',
  switchTab(t){
    this.tab = t;
    ['daily','monthly','yearly'].forEach(x=>$('#rt-'+x).classList.toggle('active', x===t));
    this.renderFilters();
    this.renderBody();
  },
  renderFilters(){
    const classSel = `<div class="field"><label>कक्षा</label><select id="rt-class" onchange="ReportsUI.onFilterChange()">
      <option value="all">सबै</option>${State.config.classes.map(c=>`<option value="${c.name}">${c.name}</option>`).join('')}</select></div>`;
    const el = $('#rt-filters');
    if(this.tab==='daily'){
      el.innerHTML = `<div class="field"><label>मिति</label><input type="date" id="rt-date" value="${this.date}" onchange="ReportsUI.onFilterChange()"></div>${classSel}`;
    } else if(this.tab==='monthly'){
      el.innerHTML = `
        <div class="field"><label>वर्ष</label><input type="number" id="rt-year" value="${this.year}" onchange="ReportsUI.onFilterChange()"></div>
        <div class="field"><label>महिना</label><select id="rt-month" onchange="ReportsUI.onFilterChange()">
          ${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1===this.month?'selected':''}>${MONTHS_EN[i]}</option>`).join('')}
        </select></div>
        ${classSel}`;
    } else {
      el.innerHTML = `<div class="field"><label>वर्ष</label><input type="number" id="rt-year" value="${this.year}" onchange="ReportsUI.onFilterChange()"></div>${classSel}`;
    }
    setTimeout(()=>{ const c=$('#rt-class'); if(c) c.value=this.klass; },0);
  },
  onFilterChange(){
    if($('#rt-date')) this.date = $('#rt-date').value;
    if($('#rt-year')) this.year = +$('#rt-year').value;
    if($('#rt-month')) this.month = +$('#rt-month').value;
    if($('#rt-class')) this.klass = $('#rt-class').value;
    this.renderBody();
  },
  peopleFiltered(){
    let p = State.users.filter(u=>u.status!=='inactive');
    if(this.klass!=='all') p = p.filter(u=>u.class===this.klass);
    return p.sort((a,b)=> (a.class||'').localeCompare(b.class||'') || a.name.localeCompare(b.name));
  },
  letterBadgeClass(letter){
    if(letter==='PP') return 'cell-pp'; if(letter==='P') return 'cell-p';
    if(letter==='H') return 'cell-h'; if(letter==='HOL') return 'cell-hol';
    return 'cell-a';
  },
  async renderBody(){
    const body = $('#rt-body'); if(!body) return;
    const people = this.peopleFiltered();
    if(people.length===0){ body.innerHTML = `<div class="empty-state">कोही फेला परेन</div>`; return; }

    if(this.tab==='daily'){
      const recs = await DB.attendanceByDate(this.date);
      const holiday = Attendance.isHoliday(this.date);
      const rows = people.map(u=>{
        const r = recs.find(x=>x.userId===u.id);
        const letter = holiday ? 'HOL' : (r ? Attendance.finalLetter(r) : 'A');
        return `<tr><td class="name-cell">${u.name}<div class="hint">${ROLE_LABEL[u.role]}${u.class?' • '+u.class+' '+u.section:''}</div></td>
          <td class="${this.letterBadgeClass(letter)}">${letter}</td>
          <td>${r&&r.markedAt&&r.markedAt.morning ? new Date(r.markedAt.morning).toLocaleTimeString('ne-NP',{hour:'2-digit',minute:'2-digit'}) : '—'}</td>
          <td>${r&&r.markedAt&&r.markedAt.evening ? new Date(r.markedAt.evening).toLocaleTimeString('ne-NP',{hour:'2-digit',minute:'2-digit'}) : '—'}</td>
          </tr>`;
      }).join('');
      body.innerHTML = `<div class="table-wrap"><table><thead><tr><th class="name-cell">नाम</th><th>स्थिति</th><th>बिहान</th><th>साँझ</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    else if(this.tab==='monthly'){
      const days = new Date(this.year, this.month, 0).getDate();
      const dateList = Array.from({length:days},(_,i)=>`${this.year}-${pad2(this.month)}-${pad2(i+1)}`);
      const allRecs = await DB.allAttendance();
      const head = dateList.map(d=>{
        const dow = new Date(d+'T00:00:00').getDay();
        return `<th style="${dow===6?'color:var(--rose);':''}">${+d.slice(-2)}</th>`;
      }).join('');
      const rows = people.map(u=>{
        let pCount=0, halfCount=0, absentCount=0, workingDays=0;
        const cells = dateList.map(d=>{
          const holiday = Attendance.isHoliday(d);
          if(holiday) return `<td class="cell-hol">-</td>`;
          const isFuture = new Date(d+'T00:00:00') > new Date();
          const rec = allRecs.find(r=>r.userId===u.id && r.date===d);
          const letter = rec ? Attendance.finalLetter(rec) : (isFuture ? '' : 'A');
          if(letter){ workingDays++; if(letter==='PP'||letter==='P') pCount++; else if(letter==='H'){halfCount++;} else if(letter==='A') absentCount++; }
          return `<td class="${letter?this.letterBadgeClass(letter):''}">${letter||''}</td>`;
        }).join('');
        const pct = workingDays>0 ? (((pCount + halfCount*0.5)/workingDays)*100).toFixed(0) : '0';
        return `<tr><td class="name-cell">${u.name}<div class="hint">${u.class||ROLE_LABEL[u.role]} ${u.section||''}</div></td>${cells}
          <td style="font-weight:700;">${pCount}</td><td style="font-weight:700;color:var(--amber);">${halfCount}</td><td style="font-weight:700;color:var(--rose);">${absentCount}</td><td style="font-weight:700;">${pct}%</td></tr>`;
      }).join('');
      body.innerHTML = `<div class="table-wrap"><table><thead><tr><th class="name-cell">नाम</th>${head}<th>P</th><th>H</th><th>A</th><th>%</th></tr></thead><tbody>${rows}</tbody></table></div>
        <p class="hint" style="margin-top:8px;">P=पूर्ण उपस्थित, H=आधा दिन, A=अनुपस्थित, रातो='-' चिन्ह भएको बिदा/शनिबार।</p>`;
    }

    else { // yearly
      const allRecs = await DB.allAttendance();
      const head = MONTHS_EN.map(m=>`<th>${m.slice(0,3)}</th>`).join('');
      const rows = people.map(u=>{
        let yearTotalP=0, yearTotalWorking=0;
        const cells = MONTHS_EN.map((_,mi)=>{
          const days = new Date(this.year, mi+1, 0).getDate();
          let p=0, half=0, working=0;
          for(let d=1; d<=days; d++){
            const dateStr = `${this.year}-${pad2(mi+1)}-${pad2(d)}`;
            if(Attendance.isHoliday(dateStr)) continue;
            if(new Date(dateStr+'T00:00:00') > new Date()) continue;
            const rec = allRecs.find(r=>r.userId===u.id && r.date===dateStr);
            const letter = rec ? Attendance.finalLetter(rec) : 'A';
            working++;
            if(letter==='PP'||letter==='P') p++; else if(letter==='H') half++;
          }
          yearTotalP += p + half*0.5; yearTotalWorking += working;
          const pct = working>0 ? (((p+half*0.5)/working)*100).toFixed(0) : '-';
          return `<td>${working>0?pct+'%':'-'}</td>`;
        }).join('');
        const yearlyPct = yearTotalWorking>0 ? ((yearTotalP/yearTotalWorking)*100).toFixed(0) : '0';
        return `<tr><td class="name-cell">${u.name}<div class="hint">${u.class||ROLE_LABEL[u.role]} ${u.section||''}</div></td>${cells}<td style="font-weight:700;">${yearlyPct}%</td></tr>`;
      }).join('');
      body.innerHTML = `<div class="table-wrap"><table><thead><tr><th class="name-cell">नाम</th>${head}<th>वार्षिक %</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
  }
};
</script>
<script>
/* ---------------------------- Excel export (styled, via ExcelJS) ---------------------------- */
ReportsUI.exportExcel = async function(){
  toast('एक्सेल तयार गर्दैछ...','info',1500);
  const wb = new ExcelJS.Workbook();
  wb.creator = State.config.schoolName;
  const cfg = State.config;
  const people = this.peopleFiltered();
  const COLORS = { p:'FFDDEBDD', pp:'FFBFE0BF', half:'FFF3E4C4', a:'FFF4DEDE', hol:'FFF6C8C8', head:'FFE7DFCE', title:'FF83192A' };

  function styleTitleRow(ws, rowNum, span){
    ws.mergeCells(rowNum,1,rowNum,span);
    const c = ws.getCell(rowNum,1);
    c.value = cfg.schoolName + (cfg.address? ' - '+cfg.address:'');
    c.font = {bold:true, size:14, color:{argb:'FFFFFFFF'}};
    c.alignment = {horizontal:'center', vertical:'middle'};
    c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:COLORS.title}};
    ws.getRow(rowNum).height = 26;
  }
  function styleHeaderRow(ws, rowNum, lastCol){
    for(let i=1;i<=lastCol;i++){
      const c = ws.getCell(rowNum,i);
      c.font = {bold:true, size:10};
      c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:COLORS.head}};
      c.alignment = {horizontal:'center', vertical:'middle'};
      c.border = {bottom:{style:'thin'}};
    }
  }
  function letterFill(letter){
    if(letter==='PP') return COLORS.pp;
    if(letter==='P') return COLORS.p;
    if(letter==='H') return COLORS.half;
    if(letter==='HOL') return COLORS.hol;
    if(letter==='A') return COLORS.a;
    return null;
  }

  if(this.tab==='daily'){
    const ws = wb.addWorksheet('दैनिक हाजिर');
    styleTitleRow(ws, 1, 5);
    ws.mergeCells(2,1,2,5); ws.getCell(2,1).value = `मिति: ${this.date}`; ws.getCell(2,1).alignment={horizontal:'center'};
    ws.addRow([]);
    const headRow = 4;
    ws.getRow(headRow).values = ['नाम','भूमिका','कक्षा/सेक्सन','स्थिति','समय (बिहान/साँझ)'];
    styleHeaderRow(ws, headRow, 5);
    const recs = await DB.attendanceByDate(this.date);
    const holiday = Attendance.isHoliday(this.date);
    people.forEach((u,i)=>{
      const r = recs.find(x=>x.userId===u.id);
      const letter = holiday ? 'HOL' : (r?Attendance.finalLetter(r):'A');
      const timeStr = r ? [r.markedAt?.morning?new Date(r.markedAt.morning).toLocaleTimeString():'', r.markedAt?.evening?new Date(r.markedAt.evening).toLocaleTimeString():''].filter(Boolean).join(' / ') : '';
      const row = ws.addRow([u.name, ROLE_LABEL[u.role], `${u.class||''} ${u.section||''}`, letter, timeStr]);
      const fill = letterFill(letter);
      if(fill) row.getCell(4).fill = {type:'pattern',pattern:'solid',fgColor:{argb:fill}};
      row.getCell(4).font = {bold:true};
      row.eachCell(c=>c.alignment={horizontal:'center'});
    });
    ws.columns = [{width:22},{width:14},{width:16},{width:10},{width:22}];
  }

  else if(this.tab==='monthly'){
    const ws = wb.addWorksheet(`${this.year}-${pad2(this.month)}`);
    const days = new Date(this.year, this.month, 0).getDate();
    const lastCol = 2 + days + 4;
    styleTitleRow(ws, 1, lastCol);
    ws.mergeCells(2,1,2,lastCol); ws.getCell(2,1).value = `मासिक हाजिर - ${MONTHS_EN[this.month-1]} ${this.year} ${this.klass!=='all'?'| कक्षा: '+this.klass:''}`;
    ws.getCell(2,1).alignment={horizontal:'center'};
    const headRow=4;
    const headVals = ['क्र.सं.','नाम']; for(let d=1;d<=days;d++) headVals.push(d);
    headVals.push('P','H','A','%');
    ws.getRow(headRow).values = headVals;
    styleHeaderRow(ws, headRow, lastCol);
    // shade saturday header cells red
    for(let d=1; d<=days; d++){
      const dow = new Date(`${this.year}-${pad2(this.month)}-${pad2(d)}T00:00:00`).getDay();
      if(dow===6) ws.getCell(headRow, 2+d).fill = {type:'pattern',pattern:'solid',fgColor:{argb:COLORS.hol}};
    }
    const allRecs = await DB.allAttendance();
    people.forEach((u,i)=>{
      let pCount=0, halfCount=0, absentCount=0, working=0;
      const rowVals = [i+1, u.name];
      for(let d=1; d<=days; d++){
        const dateStr = `${this.year}-${pad2(this.month)}-${pad2(d)}`;
        const holiday = Attendance.isHoliday(dateStr);
        const isFuture = new Date(dateStr+'T00:00:00') > new Date();
        let letter = '';
        if(holiday) letter='HOL';
        else if(!isFuture){ const rec = allRecs.find(r=>r.userId===u.id && r.date===dateStr); letter = rec?Attendance.finalLetter(rec):'A'; }
        if(letter && letter!=='HOL'){ working++; if(letter==='PP'||letter==='P') pCount++; else if(letter==='H') halfCount++; else if(letter==='A') absentCount++; }
        rowVals.push(letter==='HOL' ? '-' : letter);
      }
      const pct = working>0 ? Math.round(((pCount+halfCount*0.5)/working)*100) : 0;
      rowVals.push(pCount, halfCount, absentCount, pct+'%');
      const row = ws.addRow(rowVals);
      for(let d=1; d<=days; d++){
        const cell = row.getCell(2+d);
        const val = cell.value;
        const fill = letterFill(val==='-'?'HOL':val);
        if(fill) cell.fill = {type:'pattern',pattern:'solid',fgColor:{argb:fill}};
        cell.alignment={horizontal:'center'};
        cell.font={bold:true, size:9};
      }
      row.getCell(1).alignment={horizontal:'center'};
    });
    ws.getColumn(1).width=6; ws.getColumn(2).width=20;
    for(let d=1; d<=days; d++) ws.getColumn(2+d).width=4;
    ws.getColumn(3+days).width=6; ws.getColumn(4+days).width=6; ws.getColumn(5+days).width=6; ws.getColumn(6+days).width=7;
  }

  else { // yearly
    const ws = wb.addWorksheet(`वार्षिक ${this.year}`);
    const lastCol = 2 + 12 + 1;
    styleTitleRow(ws, 1, lastCol);
    ws.mergeCells(2,1,2,lastCol); ws.getCell(2,1).value = `वार्षिक हाजिर रिपोर्ट - ${this.year} ${this.klass!=='all'?'| कक्षा: '+this.klass:''}`;
    ws.getCell(2,1).alignment={horizontal:'center'};
    const headRow=4;
    ws.getRow(headRow).values = ['क्र.सं.','नाम', ...MONTHS_EN, 'वार्षिक %'];
    styleHeaderRow(ws, headRow, lastCol);
    const allRecs = await DB.allAttendance();
    people.forEach((u,i)=>{
      let yTotalP=0, yTotalWorking=0;
      const rowVals=[i+1,u.name];
      for(let mi=0; mi<12; mi++){
        const days = new Date(this.year, mi+1, 0).getDate();
        let p=0, half=0, working=0;
        for(let d=1; d<=days; d++){
          const dateStr = `${this.year}-${pad2(mi+1)}-${pad2(d)}`;
          if(Attendance.isHoliday(dateStr)) continue;
          if(new Date(dateStr+'T00:00:00') > new Date()) continue;
          const rec = allRecs.find(r=>r.userId===u.id && r.date===dateStr);
          const letter = rec?Attendance.finalLetter(rec):'A';
          working++; if(letter==='PP'||letter==='P') p++; else if(letter==='H') half++;
        }
        yTotalP += p+half*0.5; yTotalWorking += working;
        rowVals.push(working>0 ? Math.round(((p+half*0.5)/working)*100)+'%' : '-');
      }
      rowVals.push(yTotalWorking>0 ? Math.round((yTotalP/yTotalWorking)*100)+'%':'0%');
      const row = ws.addRow(rowVals);
      row.eachCell(c=>c.alignment={horizontal:'center'});
    });
    ws.getColumn(1).width=6; ws.getColumn(2).width=20;
    for(let i=0;i<12;i++) ws.getColumn(3+i).width=8;
    ws.getColumn(15).width=10;
  }

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fname = this.tab==='daily' ? `hajir_${this.date}.xlsx` : this.tab==='monthly' ? `hajir_${this.year}_${pad2(this.month)}.xlsx` : `hajir_varshik_${this.year}.xlsx`;
  a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('एक्सेल डाउनलोड भयो','success');
};
</script>
<script>
/* ---------------------------- Settings view ---------------------------- */
Views.settings = function(main){
  const cfg = State.config;
  main.innerHTML = `
    <div class="card">
      <div class="section-eyebrow">विद्यालय विवरण</div>
      <div class="field"><label>विद्यालयको नाम</label><input type="text" id="st-schoolname" value="${cfg.schoolName}"></div>
      <div class="field"><label>ठेगाना</label><input type="text" id="st-address" value="${cfg.address||''}"></div>
      <div class="field"><label>फोन</label><input type="text" id="st-phone" value="${cfg.phone||''}"></div>
      <button class="btn btn-himal btn-sm" onclick="SettingsUI.saveSchool()">विवरण सुरक्षित गर्नुहोस्</button>
    </div>

    <div class="card">
      <div class="section-eyebrow">हाजिर समय (सेटिङद्वारा नियन्त्रण)</div>
      <p class="hint" style="margin-bottom:10px;">बिहान समयमा पूर्ण उपस्थिति (P), समय सकेपछि दिउँसोको खाजा समयसम्म आधा दिन (H), त्यसपछि बन्द। साँझको समयमा हाजिर लगाए डबल P (PP) हुन्छ।</p>
      <div class="field-row">
        <div class="field"><label>बिहान हाजिर सुरु</label><input type="time" id="st-morningStart" value="${cfg.times.morningStart}"></div>
        <div class="field"><label>बिहान पूर्ण हाजिर अन्त्य</label><input type="time" id="st-morningEnd" value="${cfg.times.morningEnd}"></div>
      </div>
      <div class="field"><label>दिउँसो खाजा समय (आधा दिन कटअफ)</label><input type="time" id="st-lunchEnd" value="${cfg.times.lunchEnd}"></div>
      <div class="field-row">
        <div class="field"><label>साँझ हाजिर सुरु</label><input type="time" id="st-eveningStart" value="${cfg.times.eveningStart}"></div>
        <div class="field"><label>साँझ हाजिर अन्त्य</label><input type="time" id="st-eveningEnd" value="${cfg.times.eveningEnd}"></div>
      </div>
      <button class="btn btn-himal btn-sm" onclick="SettingsUI.saveTimes()">समय सुरक्षित गर्नुहोस्</button>
    </div>

    <div class="card">
      <div class="section-eyebrow">नियन्त्रणहरू</div>
      <div class="toggle-row">
        <div><div class="toggle-label">फेस लक (लगइन)</div><div class="toggle-desc">लक स्क्रिनमा फेस पहिचान सक्षम/असक्षम गर्नुहोस्</div></div>
        <label class="switch"><input type="checkbox" id="st-faceLock" ${cfg.faceLockEnabled?'checked':''} onchange="SettingsUI.saveToggles()"><span class="slider"></span></label>
      </div>
      <div class="toggle-row">
        <div><div class="toggle-label">फेस डिटेक्सन हाजिर</div><div class="toggle-desc">हाजिर लगाउने प्रमुख विधि</div></div>
        <label class="switch"><input type="checkbox" id="st-faceAtt" ${cfg.faceAttendanceEnabled?'checked':''} onchange="SettingsUI.saveToggles()"><span class="slider"></span></label>
      </div>
      <div class="toggle-row">
        <div><div class="toggle-label">QR कोड हाजिर</div><div class="toggle-desc">वैकल्पिक हाजिर विधि</div></div>
        <label class="switch"><input type="checkbox" id="st-qrAtt" ${cfg.qrAttendanceEnabled?'checked':''} onchange="SettingsUI.saveToggles()"><span class="slider"></span></label>
      </div>
      <div class="toggle-row">
        <div><div class="toggle-label">शनिबार स्वतः बिदा</div><div class="toggle-desc">हरेक शनिबार रातो चिन्ह सहित बिदा गणना हुन्छ</div></div>
        <label class="switch"><input type="checkbox" id="st-satHoliday" ${cfg.saturdayHoliday?'checked':''} onchange="SettingsUI.saveToggles()"><span class="slider"></span></label>
      </div>
    </div>

    <div class="card">
      <div class="section-eyebrow">कक्षा र सेक्सन व्यवस्थापन</div>
      <div id="st-classes-list"></div>
      <div class="field-row" style="margin-top:10px;">
        <div class="field"><input type="text" id="st-new-class" placeholder="नयाँ कक्षाको नाम"></div>
        <button class="btn btn-himal btn-sm" onclick="SettingsUI.addClass()">➕ कक्षा थप्नुहोस्</button>
      </div>
    </div>

    <div class="card">
      <div class="section-eyebrow">विशेष बिदा (Holidays)</div>
      <div id="st-holiday-list"></div>
      <div class="field-row" style="margin-top:10px;">
        <div class="field"><input type="date" id="st-new-holiday-date"></div>
        <div class="field"><input type="text" id="st-new-holiday-label" placeholder="बिदाको कारण"></div>
        <button class="btn btn-himal btn-sm" onclick="SettingsUI.addHoliday()">➕ थप्नुहोस्</button>
      </div>
    </div>

    <div class="card">
      <div class="section-eyebrow">ब्याकअप तथा डाटा</div>
      <p class="hint" style="margin-bottom:10px;">सम्पूर्ण डाटा (विद्यालय, व्यक्ति, हाजिर) यस डिभाइसको IndexedDB मा सुरक्षित छ। नियमित ब्याकअप डाउनलोड गर्न सुझाव दिइन्छ।</p>
      <div class="btn-row">
        <button class="btn btn-gold btn-sm" onclick="SettingsUI.backup()">⬇️ ब्याकअप डाउनलोड</button>
        <label class="btn btn-outline btn-sm">⬆️ ब्याकअप पुनर्स्थापना<input type="file" accept=".json" style="display:none" onchange="SettingsUI.restore(event)"></label>
      </div>
    </div>

    <div class="card">
      <div class="section-eyebrow">खाता</div>
      <button class="btn btn-danger btn-sm" onclick="Auth.logout()">⏻ लगआउट गर्नुहोस्</button>
    </div>
  `;
  SettingsUI.renderClasses();
  SettingsUI.renderHolidays();
};

const SettingsUI = {
  async saveSchool(){
    const cfg = State.config;
    cfg.schoolName = $('#st-schoolname').value.trim();
    cfg.address = $('#st-address').value.trim();
    cfg.phone = $('#st-phone').value.trim();
    await DB.putSetting(cfg);
    await loadState();
    toast('विवरण सुरक्षित भयो','success');
    App.showMain();
  },
  async saveTimes(){
    const cfg = State.config;
    cfg.times = {
      morningStart:$('#st-morningStart').value, morningEnd:$('#st-morningEnd').value,
      lunchEnd:$('#st-lunchEnd').value, eveningStart:$('#st-eveningStart').value, eveningEnd:$('#st-eveningEnd').value,
    };
    await DB.putSetting(cfg);
    await loadState();
    toast('समय सुरक्षित भयो','success');
  },
  async saveToggles(){
    const cfg = State.config;
    cfg.faceLockEnabled = $('#st-faceLock').checked;
    cfg.faceAttendanceEnabled = $('#st-faceAtt').checked;
    cfg.qrAttendanceEnabled = $('#st-qrAtt').checked;
    cfg.saturdayHoliday = $('#st-satHoliday').checked;
    await DB.putSetting(cfg);
    await loadState();
    toast('सुरक्षित भयो','success',1500);
  },
  renderClasses(){
    const el = $('#st-classes-list'); if(!el) return;
    el.innerHTML = State.config.classes.map((c,ci)=>`
      <div class="list-row">
        <div class="list-main">
          <div class="lname">${c.name}</div>
          <div class="lsub" style="display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;">
            ${c.sections.map((s,si)=>`<span class="chip">${s} <button onclick="SettingsUI.removeSection(${ci},${si})">✕</button></span>`).join('')}
            <button class="link-btn" onclick="SettingsUI.addSection(${ci})">+ सेक्सन</button>
          </div>
        </div>
        <button class="icon-sm danger" onclick="SettingsUI.removeClass(${ci})">🗑️</button>
      </div>`).join('') || `<div class="empty-state">कक्षा थपिएको छैन</div>`;
  },
  async addClass(){
    const name = $('#st-new-class').value.trim();
    if(!name) return;
    State.config.classes.push({name, sections:['क']});
    await DB.putSetting(State.config);
    $('#st-new-class').value='';
    this.renderClasses();
    toast('कक्षा थपियो','success',1500);
  },
  async removeClass(ci){
    State.config.classes.splice(ci,1);
    await DB.putSetting(State.config);
    this.renderClasses();
  },
  async addSection(ci){
    const s = prompt('नयाँ सेक्सनको नाम (जस्तै: क, ख, ग)');
    if(!s) return;
    State.config.classes[ci].sections.push(s.trim());
    await DB.putSetting(State.config);
    this.renderClasses();
  },
  async removeSection(ci,si){
    State.config.classes[ci].sections.splice(si,1);
    await DB.putSetting(State.config);
    this.renderClasses();
  },
  renderHolidays(){
    const el = $('#st-holiday-list'); if(!el) return;
    const hols = State.holidays.slice().sort((a,b)=>a.date.localeCompare(b.date));
    el.innerHTML = hols.map(h=>`
      <div class="list-row"><div class="list-main"><div class="lname">${h.date}</div><div class="lsub">${h.label}</div></div>
      <button class="icon-sm danger" onclick="SettingsUI.removeHoliday('${h.date}')">🗑️</button></div>`).join('') || `<div class="empty-state">कुनै विशेष बिदा थपिएको छैन</div>`;
  },
  async addHoliday(){
    const d = $('#st-new-holiday-date').value;
    const label = $('#st-new-holiday-label').value.trim() || 'बिदा';
    if(!d) return;
    await DB.setHoliday(d,label);
    await loadState();
    this.renderHolidays();
    toast('बिदा थपियो','success',1500);
  },
  async removeHoliday(d){
    await DB.removeHoliday(d);
    await loadState();
    this.renderHolidays();
  },
  async backup(){
    const data = {
      config: State.config,
      users: await DB.allUsers(),
      attendance: await DB.allAttendance(),
      holidays: await DB.allHolidays(),
      exportedAt: new Date().toISOString(),
    };
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download = `hajir_backup_${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('ब्याकअप डाउनलोड भयो','success');
  },
  async restore(e){
    const f = e.target.files[0]; if(!f) return;
    if(!confirm('ब्याकअप पुनर्स्थापना गर्दा हालको सबै डाटा (यदि नाम/mismatch भए) अधिलेखन हुन सक्छ। अगाडि बढ्ने हो?')) return;
    try{
      const text = await f.text();
      const data = JSON.parse(text);
      if(data.config) await DB.putSetting(data.config);
      if(data.users) for(const u of data.users) await DB.putUser(u);
      if(data.attendance) for(const a of data.attendance) await DB.putAttendance(a);
      if(data.holidays) for(const h of data.holidays) await DB.setHoliday(h.date,h.label);
      toast('पुनर्स्थापना सफल भयो','success');
      await loadState();
      App.boot();
    }catch(err){ toast('फाइल पढ्न सकिएन','error'); }
  }
};
</script>
</body>
</html>
