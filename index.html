<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>हिमाल विद्यालय हाजिर प्रणाली</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{
  --maroon:#83192A;
  --maroon-dark:#5E1220;
  --himal:#0B3D66;
  --himal-deep:#082A47;
  --ivory:#F7F1E6;
  --paper:#FFFDF8;
  --ink:#241C15;
  --ink-soft:#5A5148;
  --gold:#C79A3B;
  --gold-soft:#E8D9B0;
  --pine:#2F5D3A;
  --pine-soft:#DDEBDD;
  --rose:#A23B3B;
  --rose-soft:#F4DEDE;
  --amber:#B6812B;
  --amber-soft:#F3E4C4;
  --stone:#E7DFCE;
  --stone-line:#D8CDB4;
  --shadow: 0 10px 30px -12px rgba(36,28,21,0.28);
  --radius: 14px;
  --font-display:'Noto Serif Devanagari', serif;
  --font-body:'Noto Sans Devanagari','Poppins',sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--ivory);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold-soft);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
.hidden{display:none !important;}

/* ---------- Himalayan skyline divider (signature motif) ---------- */
.skyline{
  width:100%; height:22px; display:block;
  background: linear-gradient(180deg, transparent 0%, transparent 100%);
}
.skyline svg{width:100%;height:100%;display:block;}

/* ---------- App shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  background: linear-gradient(135deg,var(--himal-deep) 0%, var(--himal) 55%, var(--maroon-dark) 130%);
  color:#fff; padding:14px 18px 26px; position:relative; overflow:hidden;
}
.topbar .row{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:2;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-logo{width:42px;height:42px;border-radius:10px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;color:var(--himal-deep);font-size:18px;overflow:hidden;flex-shrink:0;}
.brand-logo img{width:100%;height:100%;object-fit:cover;}
.brand-text .school-name{font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.2;}
.brand-text .school-sub{font-size:11px;opacity:.8;letter-spacing:.02em;}
.top-actions{display:flex;gap:8px;}
.icon-btn{
  background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.25); color:#fff;
  width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;
  transition:.15s;
}
.icon-btn:active{transform:scale(.94); background:rgba(255,255,255,0.26);}
.topbar-ridge{position:absolute;left:0;right:0;bottom:-1px;height:24px;z-index:1;}
.topbar-ridge svg{width:100%;height:100%;display:block;}

main{flex:1; padding:18px 16px 90px; max-width:1180px; width:100%; margin:0 auto;}

/* ---------- Cards ---------- */
.card{
  background:var(--paper); border:1px solid var(--stone-line); border-radius:var(--radius);
  padding:18px; box-shadow:var(--shadow); margin-bottom:16px;
}
.card-title{font-family:var(--font-display);font-weight:700;font-size:17px;margin:0 0 4px;color:var(--maroon-dark);}
.card-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;}
.section-eyebrow{
  font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold);
  font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:6px;
}
.section-eyebrow::before{content:"";width:16px;height:2px;background:var(--gold);display:inline-block;}

.grid{display:grid; gap:14px;}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 18px; border-radius:10px; border:none; font-weight:600; font-size:14px;
  transition:.15s; text-decoration:none;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--maroon); color:#fff;}
.btn-primary:hover{background:var(--maroon-dark);}
.btn-himal{background:var(--himal); color:#fff;}
.btn-gold{background:var(--gold); color:var(--himal-deep);}
.btn-outline{background:transparent; border:1.5px solid var(--stone-line); color:var(--ink);}
.btn-outline:hover{border-color:var(--maroon);color:var(--maroon);}
.btn-ghost{background:var(--stone); color:var(--ink);}
.btn-danger{background:var(--rose); color:#fff;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}

/* ---------- Forms ---------- */
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
.field input[type=text], .field input[type=number], .field input[type=password], .field input[type=date], .field input[type=time], .field select, .field textarea{
  width:100%; padding:11px 12px; border-radius:9px; border:1.5px solid var(--stone-line); background:var(--paper);
  font-size:14.5px; color:var(--ink); outline:none; transition:.15s;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--himal); box-shadow:0 0 0 3px rgba(11,61,102,0.12);}
.field-row{display:flex; gap:10px;}
.field-row > *{flex:1;}
.hint{font-size:11.5px; color:var(--ink-soft); margin-top:5px;}
.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--stone-line);}
.toggle-row:last-child{border-bottom:none;}
.toggle-label{font-size:14px; font-weight:600;}
.toggle-desc{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.switch{position:relative; width:46px; height:26px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.slider{position:absolute;inset:0;background:var(--stone-line);border-radius:999px;transition:.2s;cursor:pointer;}
.slider::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch input:checked + .slider{background:var(--pine);}
.switch input:checked + .slider::before{transform:translateX(20px);}

/* ---------- Badges / chips ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
.badge-pine{background:var(--pine-soft); color:var(--pine);}
.badge-rose{background:var(--rose-soft); color:var(--rose);}
.badge-amber{background:var(--amber-soft); color:var(--amber);}
.badge-gold{background:var(--gold-soft); color:#7A5C1E;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--stone);font-size:12.5px;font-weight:600;border:1px solid var(--stone-line);}
.chip button{background:none;border:none;color:var(--rose);font-weight:800;padding:0;font-size:13px;}

/* ---------- Bottom nav ---------- */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; background:var(--paper); border-top:1px solid var(--stone-line);
  display:flex; z-index:50; box-shadow:0 -6px 20px rgba(36,28,21,0.08);
}
.nav-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 2px 8px;
  color:var(--ink-soft); background:none; border:none; font-size:10.5px; font-weight:600;
}
.nav-item .nav-ic{font-size:19px;}
.nav-item.active{color:var(--maroon);}
.nav-item.active .nav-ic{transform:translateY(-1px);}

@media (min-width:860px){
  .bottom-nav{
    position:fixed; top:0; bottom:0; left:0; right:auto; width:220px; flex-direction:column;
    border-top:none; border-right:1px solid var(--stone-line); padding-top:18px; align-items:stretch;
  }
  .nav-item{flex-direction:row; justify-content:flex-start; gap:12px; padding:13px 22px; font-size:14px; border-radius:0 999px 999px 0;}
  .nav-item.active{background:var(--stone); }
  #app{padding-left:220px;}
  main{padding-top:18px;}
  .topbar{display:none;}
  .desktop-topbar{display:flex !important;}
}
.desktop-topbar{display:none; align-items:center; justify-content:space-between; padding:16px 26px; background:var(--paper); border-bottom:1px solid var(--stone-line); position:sticky; top:0; z-index:40;}

/* ---------- Lock / Login screen ---------- */
.lock-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  background: radial-gradient(circle at 50% -10%, #123a5c 0%, var(--himal-deep) 45%, var(--maroon-dark) 100%);
  position:relative; overflow:hidden;
}
.lock-ridge{position:absolute; bottom:0; left:0; right:0;}
.lock-ridge svg{width:100%;display:block;}
.lock-card{
  position:relative; z-index:3; background:var(--paper); border-radius:20px; padding:32px 26px;
  width:100%; max-width:380px; box-shadow:0 30px 60px -20px rgba(0,0,0,0.55); text-align:center;
}
.lock-photo{
  width:96px; height:96px; border-radius:50%; margin:0 auto 14px; border:4px solid var(--gold);
  overflow:hidden; background:var(--stone); display:flex; align-items:center; justify-content:center; font-size:34px;
}
.lock-photo img{width:100%;height:100%;object-fit:cover;}
.lock-school{font-family:var(--font-display); font-weight:700; font-size:19px; color:var(--maroon-dark); margin:0 0 2px;}
.lock-hm{font-size:12.5px; color:var(--ink-soft); margin:0 0 20px;}

/* ---------- Camera / capture ---------- */
.cam-wrap{position:relative; width:100%; aspect-ratio:4/3; background:#10151a; border-radius:14px; overflow:hidden; margin-bottom:10px;}
.cam-wrap video, .cam-wrap canvas, .cam-wrap img.cam-preview{width:100%; height:100%; object-fit:cover; display:block;}
.cam-overlay-frame{position:absolute; inset:10%; border:2.5px dashed rgba(255,255,255,0.55); border-radius:16px; pointer-events:none;}
.cam-status{position:absolute; top:10px; left:10px; right:10px; display:flex; justify-content:center;}
.cam-status span{background:rgba(0,0,0,0.55); color:#fff; font-size:12px; padding:6px 14px; border-radius:999px; font-weight:600;}
.cam-controls{display:flex; gap:8px; justify-content:center;}

/* ---------- ID card ---------- */
.idcard{
  width:100%; max-width:340px; margin:0 auto; border-radius:16px; overflow:hidden;
  background:var(--paper); border:1px solid var(--stone-line); box-shadow:var(--shadow); position:relative;
}
.idcard-head{
  background:linear-gradient(120deg,var(--himal-deep),var(--himal) 60%, var(--maroon-dark));
  color:#fff; padding:14px 14px 30px; text-align:center; position:relative;
}
.idcard-head .sname{font-family:var(--font-display); font-weight:700; font-size:15px;}
.idcard-head .saddr{font-size:10px; opacity:.85;}
.idcard-ridge{position:absolute; left:0; right:0; bottom:-1px;}
.idcard-ridge svg{width:100%; display:block;}
.idcard-body{padding:0 18px 18px; margin-top:-22px; text-align:center; position:relative; z-index:2;}
.idcard-photo{width:88px; height:88px; border-radius:14px; border:4px solid var(--gold); overflow:hidden; margin:0 auto 8px; background:var(--stone);}
.idcard-photo img{width:100%;height:100%;object-fit:cover;}
.idcard-name{font-weight:700; font-size:16px;}
.idcard-role{font-size:11px; color:var(--gold-soft); background:var(--himal-deep); display:inline-block; padding:2px 10px; border-radius:999px; margin-top:3px;}
.idcard-meta{font-size:11.5px; color:var(--ink-soft); margin-top:8px; line-height:1.6;}
.idcard-qr{margin:12px auto 4px; width:120px; height:120px; background:#fff; padding:6px; border-radius:10px; border:1px solid var(--stone-line);}
.idcard-id{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-soft); letter-spacing:.05em;}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto; border-radius:10px; border:1px solid var(--stone-line);}
table{width:100%; border-collapse:collapse; font-size:13px;}
th,td{padding:9px 10px; text-align:center; border-bottom:1px solid var(--stone-line); white-space:nowrap;}
th{background:var(--stone); font-weight:700; color:var(--maroon-dark); font-size:11.5px; text-transform:uppercase; letter-spacing:.02em;}
tr:last-child td{border-bottom:none;}
td.name-cell, th.name-cell{text-align:left; position:sticky; left:0; background:var(--paper); z-index:1;}
th.name-cell{background:var(--stone);}
.cell-p{color:var(--pine); font-weight:800;}
.cell-pp{color:var(--pine); font-weight:800; background:var(--pine-soft);}
.cell-h{color:var(--amber); font-weight:800;}
.cell-a{color:var(--rose); font-weight:800;}
.cell-hol{color:var(--rose); font-weight:800; background:var(--rose-soft);}

/* ---------- Empty / misc ---------- */
.empty-state{text-align:center; padding:36px 16px; color:var(--ink-soft);}
.empty-state .ic{font-size:38px; margin-bottom:8px;}
.toast-wrap{position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:92%; max-width:420px;}
.toast{
  background:var(--ink); color:#fff; padding:12px 18px; border-radius:10px; font-size:13.5px; font-weight:600;
  box-shadow:0 10px 25px rgba(0,0,0,.3); display:flex; align-items:center; gap:8px; animation:toastin .25s ease;
  width:100%;
}
.toast.success{background:var(--pine);}
.toast.error{background:var(--rose);}
.toast.warn{background:var(--amber);}
@keyframes toastin{from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);}}

.modal-bg{position:fixed; inset:0; background:rgba(20,15,10,0.55); z-index:150; display:flex; align-items:flex-end; justify-content:center;}
.modal-box{background:var(--paper); border-radius:18px 18px 0 0; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:20px; animation:modalin .2s ease;}
@keyframes modalin{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
@media (min-width:640px){
  .modal-bg{align-items:center;}
  .modal-box{border-radius:18px;}
}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.modal-head h3{font-family:var(--font-display); margin:0; color:var(--maroon-dark);}
.close-x{background:var(--stone); border:none; width:32px; height:32px; border-radius:50%; font-size:16px;}

.tabs{display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; padding-bottom:2px;}
.tab-btn{padding:8px 16px; border-radius:999px; border:1.5px solid var(--stone-line); background:var(--paper); font-size:13px; font-weight:600; white-space:nowrap; color:var(--ink-soft);}
.tab-btn.active{background:var(--maroon); border-color:var(--maroon); color:#fff;}

.list-row{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--stone-line);}
.list-row:last-child{border-bottom:none;}
.avatar{width:42px; height:42px; border-radius:10px; background:var(--stone); overflow:hidden; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--ink-soft);}
.avatar img{width:100%; height:100%; object-fit:cover;}
.list-main{flex:1; min-width:0;}
.list-main .lname{font-weight:700; font-size:14px;}
.list-main .lsub{font-size:11.5px; color:var(--ink-soft);}
.list-actions{display:flex; gap:6px;}
.icon-sm{background:var(--stone); border:none; width:32px; height:32px; border-radius:8px; font-size:13px;}
.icon-sm.danger{background:var(--rose-soft); color:var(--rose);}

.stat-box{background:var(--paper); border:1px solid var(--stone-line); border-radius:12px; padding:14px; text-align:center;}
.stat-box .num{font-family:var(--font-display); font-size:24px; font-weight:800; color:var(--maroon-dark);}
.stat-box .lbl{font-size:11px; color:var(--ink-soft); margin-top:2px;}

.big-clock{font-family:var(--font-mono); font-size:15px; text-align:center; color:var(--ink-soft); margin-bottom:2px;}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .7s linear infinite; display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}

.searchbar{display:flex; gap:8px; margin-bottom:14px;}
.searchbar input{flex:1;}

textarea{resize:vertical; min-height:70px;}
.help-note{background:var(--stone); border-radius:10px; padding:10px 12px; font-size:12px; color:var(--ink-soft); line-height:1.6;}
.link-btn{background:none;border:none;color:var(--himal);font-weight:700;font-size:13px;padding:0;}
</style>
</head>
<body>
<div id="app">

  <!-- ============ SETUP WIZARD (first run) ============ -->
  <div id="view-setup" class="hidden">
    <div class="lock-screen">
      <div class="lock-ridge">
        <svg viewBox="0 0 500 60" preserveAspectRatio="none"><polygon points="0,60 0,38 40,15 80,32 130,8 175,30 220,12 260,34 300,18 340,36 380,14 420,30 460,20 500,38 500,60" fill="#0000001a"/></svg>
      </div>
      <div class="lock-card" style="max-width:440px; text-align:left;">
        <div class="section-eyebrow" style="justify-content:center;">विद्यालय दर्ता</div>
        <h2 class="lock-school" style="text-align:center;">हाजिर प्रणाली सुरु गरौं</h2>
        <p class="lock-hm" style="text-align:center;">सुरुमा आफ्नो विद्यालयको विवरण भर्नुहोस्</p>

        <div id="setup-steps">
          <div class="setup-step" data-step="1">
            <div class="field"><label>विद्यालयको नाम *</label><input type="text" id="su-schoolname" placeholder="जस्तै: श्री सरस्वती मा.वि."></div>
            <div class="field"><label>ठेगाना</label><input type="text" id="su-address" placeholder="जिल्ला, नगरपालिका, वडा नं."></div>
            <div class="field"><label>सम्पर्क नम्बर</label><input type="text" id="su-phone" placeholder="९८XXXXXXXX"></div>
            <div class="field">
              <label>विद्यालयको लोगो (वैकल्पिक)</label>
              <input type="file" accept="image/*" id="su-logo-file">
            </div>
            <button class="btn btn-primary btn-block" onclick="Setup.next()">अगाडि बढ्नुहोस् →</button>
          </div>

          <div class="setup-step hidden" data-step="2">
            <div class="section-eyebrow">प्रधानाध्यापक (लक फोटो)</div>
            <p class="hint" style="margin-bottom:10px;">यो फोटो एप खोल्दा लक स्क्रिनमा देखिन्छ र प्रधानाध्यापकको खाता स्वतः बन्छ।</p>
            <div class="field"><label>प्रधानाध्यापकको नाम *</label><input type="text" id="su-hm-name"></div>
            <div class="field"><label>प्रयोगकर्ता नाम (लगइनको लागि) *</label><input type="text" id="su-hm-username" placeholder="जस्तै: headmaster"></div>
            <div class="field"><label>पासवर्ड / PIN *</label><input type="password" id="su-hm-pass" placeholder="कम्तिमा ४ अंक/अक्षर"></div>
            <div class="field">
              <label>प्रधानाध्यापकको फोटो *</label>
              <div id="su-hm-photo-zone"></div>
            </div>
            <div class="btn-row">
              <button class="btn btn-outline" onclick="Setup.back()">← पछाडि</button>
              <button class="btn btn-primary" style="flex:1" onclick="Setup.finish()">प्रणाली सुरु गर्नुहोस् ✓</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ LOCK / LOGIN SCREEN ============ -->
  <div id="view-lock" class="hidden">
    <div class="lock-screen">
      <div class="lock-ridge">
        <svg viewBox="0 0 500 60" preserveAspectRatio="none"><polygon points="0,60 0,38 40,15 80,32 130,8 175,30 220,12 260,34 300,18 340,36 380,14 420,30 460,20 500,38 500,60" fill="#0000001a"/></svg>
      </div>
      <div class="lock-card">
        <div class="lock-photo" id="lock-hm-photo">🏔️</div>
        <div class="lock-school" id="lock-school-name">विद्यालय</div>

<script>
/* =========================================================================
   हिमाल विद्यालय हाजिर प्रणाली — Core Application Script
   Storage: IndexedDB only (no server, fully offline-capable after first load)
   ========================================================================= */

/* ---------------------------- Utilities ---------------------------- */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const uid = () => 'ID-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2,7).toUpperCase();
const pad2 = n => String(n).padStart(2,'0');
const todayStr = (d=new Date()) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const NEPALI_DIGITS = ['०','१','२','३','४','५','६','७','८','९'];
const toNepDigits = (n) => String(n).split('').map(c => /[0-9]/.test(c) ? NEPALI_DIGITS[+c] : c).join('');
const WEEKDAYS_NE = ['आइत','सोम','मंगल','बुध','बिही','शुक्र','शनि'];
const MONTHS_EN = ['जनवरी','फेब्रुअरी','मार्च','अप्रिल','मे','जुन','जुलाई','अगस्ट','सेप्टेम्बर','अक्टोबर','नोभेम्बर','डिसेम्बर'];
const ROLE_LABEL = {teacher:'शिक्षक', student:'विद्यार्थी', headmaster:'प्रधानाध्यापक'};

function timeStrToMinutes(t){ if(!t) return null; const [h,m] = t.split(':').map(Number); return h*60+m; }
function nowMinutes(d=new Date()){ return d.getHours()*60 + d.getMinutes(); }
function fmtClock(d=new Date()){ return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; }

function toast(msg, type='info', ms=3200){
  const wrap = $('#toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (type==='success'?'success':type==='error'?'error':type==='warn'?'warn':'');
  el.innerHTML = `<span>${msg}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(-8px)'; el.style.transition='.25s'; setTimeout(()=>el.remove(),250); }, ms);
}

function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function openModal(html){
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-bg" id="modal-bg-el"><div class="modal-box">${html}</div></div>`;
  $('#modal-bg-el').addEventListener('click', (e)=>{ if(e.target.id==='modal-bg-el') closeModal(); });
}
function closeModal(){ $('#modal-root').innerHTML=''; }

/* ---------------------------- IndexedDB layer ---------------------------- */
const DB_NAME = 'himal_hajir_db';
const DB_VERSION = 1;
let _db = null;

function dbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', {keyPath:'key'});
      if(!db.objectStoreNames.contains('users')){
        const us = db.createObjectStore('users', {keyPath:'id', autoIncrement:true});
        us.createIndex('role','role',{unique:false});
        us.createIndex('qrId','qrId',{unique:true});
        us.createIndex('classSection', ['class','section'], {unique:false});
      }
      if(!db.objectStoreNames.contains('attendance')){
        const as = db.createObjectStore('attendance', {keyPath:'id', autoIncrement:true});
        as.createIndex('userDate', ['userId','date'], {unique:true});
        as.createIndex('date','date',{unique:false});
        as.createIndex('userId','userId',{unique:false});
      }
      if(!db.objectStoreNames.contains('holidays')) db.createObjectStore('holidays', {keyPath:'date'});
    };
    req.onsuccess = (e) => { _db = e.target.result; resolve(_db); };
    req.onerror = (e) => reject(e);
  });
}
function tx(storeNames, mode='readonly'){ return _db.transaction(storeNames, mode); }
function storeReq(store, method, ...args){
  return new Promise((resolve,reject)=>{
    const req = store[method](...args);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}
const DB = {
  async getSetting(key){ const t = tx('settings'); return storeReq(t.objectStore('settings'),'get',key); },
  async putSetting(obj){ const t = tx('settings','readwrite'); return storeReq(t.objectStore('settings'),'put',obj); },
  async addUser(user){ const t = tx('users','readwrite'); return storeReq(t.objectStore('users'),'add',user); },
  async putUser(user){ const t = tx('users','readwrite'); return storeReq(t.objectStore('users'),'put',user); },
  async getUser(id){ const t = tx('users'); return storeReq(t.objectStore('users'),'get',id); },
  async deleteUser(id){ const t = tx('users','readwrite'); return storeReq(t.objectStore('users'),'delete',id); },
  async allUsers(){ const t = tx('users'); return storeReq(t.objectStore('users'),'getAll'); },
  async userByQr(qrId){
    const t = tx('users'); const idx = t.objectStore('users').index('qrId');
    return storeReq(idx,'get',qrId);
  },
  async addAttendance(rec){ const t = tx('attendance','readwrite'); return storeReq(t.objectStore('attendance'),'add',rec); },
  async putAttendance(rec){ const t = tx('attendance','readwrite'); return storeReq(t.objectStore('attendance'),'put',rec); },
  async attendanceByUserDate(userId,date){
    const t = tx('attendance'); const idx = t.objectStore('attendance').index('userDate');
    return storeReq(idx,'get',[userId,date]);
  },
  async attendanceByDate(date){
    const t = tx('attendance'); const idx = t.objectStore('attendance').index('date');
    return storeReq(idx,'getAll',date);
  },
  async attendanceByUser(userId){
    const t = tx('attendance'); const idx = t.objectStore('attendance').index('userId');
    return storeReq(idx,'getAll',userId);
  },
  async allAttendance(){ const t = tx('attendance'); return storeReq(t.objectStore('attendance'),'getAll'); },
  async setHoliday(date,label){ const t = tx('holidays','readwrite'); return storeReq(t.objectStore('holidays'),'put',{date,label:label||'बिदा'}); },
  async removeHoliday(date){ const t = tx('holidays','readwrite'); return storeReq(t.objectStore('holidays'),'delete',date); },
  async allHolidays(){ const t = tx('holidays'); return storeReq(t.objectStore('holidays'),'getAll'); },
};

/* ---------------------------- Global App State ---------------------------- */
const State = {
  config: null,        // settings row 'config'
  users: [],
  holidays: [],
  currentUser: null,   // logged in staff/admin (teacher/headmaster) driving the app
  route: 'dashboard',
};

const DEFAULT_CONFIG = {
  key: 'config',
  schoolName: '', address:'', phone:'', logo:'',
  headmasterName:'', headmasterUsername:'', headmasterPass:'', headmasterPhoto:'',
  setupDone:false,
  faceLockEnabled: true,
  faceAttendanceEnabled: true,
  qrAttendanceEnabled: true,
  times:{
    morningStart:'07:00', morningEnd:'08:00',   // on-time window -> Full P
    lunchEnd:'12:30',                            // late morning window ends here -> Half P
    eveningStart:'15:30', eveningEnd:'16:15'     // evening window -> adds/records evening P
  },
  classes: [
    {name:'कक्षा १', sections:['क']},
    {name:'कक्षा २', sections:['क']},
  ],
  saturdayHoliday: true,
};

async function loadState(){
  State.config = await DB.getSetting('config');
  State.users = await DB.allUsers();
  State.holidays = await DB.allHolidays();
}

<script>
/* ---------------------------- Camera helper ---------------------------- */
const Cam = {
  stream:null, facing:'user',
  async start(videoEl, facing='user'){
    this.stop();
    try{
      const constraints = { video:{ facingMode: facing, width:{ideal:480}, height:{ideal:480} }, audio:false };
      this.stream = await navigator.mediaDevices.getUserMedia(constraints);
      videoEl.srcObject = this.stream;
      this.facing = facing;
      await new Promise(r=>{ videoEl.onloadedmetadata = () => { videoEl.play(); r(); }; });
      return true;
    }catch(err){
      toast('क्यामेरा खोल्न सकिएन: अनुमति जाँच्नुहोस्', 'error');
      return false;
    }
  },
  stop(){ if(this.stream){ this.stream.getTracks().forEach(t=>t.stop()); this.stream=null; } },
  async flip(videoEl){ return this.start(videoEl, this.facing==='user'?'environment':'user'); },
  snap(videoEl){
    const c = document.createElement('canvas');
    c.width = videoEl.videoWidth || 480; c.height = videoEl.videoHeight || 480;
    const ctx = c.getContext('2d');
    ctx.drawImage(videoEl,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg', 0.85);
  }
};

/* ---------------------------- Face-api.js helper ---------------------------- */
const Face = {
  modelsLoaded:false,
  MODEL_URL: 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights',
  async loadModels(){
    if(this.modelsLoaded) return true;
    try{
      await faceapi.nets.tinyFaceDetector.loadFromUri(this.MODEL_URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(this.MODEL_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(this.MODEL_URL);
      this.modelsLoaded = true;
      return true;
    }catch(err){
      console.error('Face model load failed', err);
      return false;
    }
  },
  async getDescriptor(imgOrVideo){
    const det = await faceapi.detectSingleFace(imgOrVideo, new faceapi.TinyFaceDetectorOptions({inputSize:224}))
      .withFaceLandmarks().withFaceDescriptor();
    if(!det) return null;
    return Array.from(det.descriptor);
  },
  distance(a,b){
    if(!a || !b || a.length!==b.length) return Infinity;
    let sum=0; for(let i=0;i<a.length;i++){ sum += (a[i]-b[i])**2; }
    return Math.sqrt(sum);
  },
  // lower distance = more similar. ~0.5 threshold typical for face-api.js
  isMatch(a,b,threshold=0.5){ return this.distance(a,b) <= threshold; }
};

/* ---------------------------- QR helper (generation via qrcodejs) ---------------------------- */
const QR = {
  renderInto(elId, text){
    const el = document.getElementById(elId);
    if(!el) return;
    el.innerHTML = '';
    new QRCode(el, { text, width:200, height:200, correctLevel: QRCode.CorrectLevel.M });
  }
};
</script>
<script>
/* ---------------------------- Setup wizard ---------------------------- */
const Setup = {
  logoData:'', hmPhotoData:'',
  init(){
    $('#su-logo-file').addEventListener('change', async (e)=>{
      const f = e.target.files[0]; if(!f) return;
      this.logoData = await fileToDataURL(f);
      toast('लोगो थपियो','success',1500);
    });
    this.renderHmPhotoZone();
  },
  renderHmPhotoZone(){
    const zone = $('#su-hm-photo-zone');
    if(this.hmPhotoData){
      zone.innerHTML = `
        <div class="cam-wrap" style="max-width:200px; margin:0 auto;">
          <img class="cam-preview" src="${this.hmPhotoData}">
        </div>
        <button class="btn btn-outline btn-sm btn-block" style="margin-top:8px;" onclick="Setup.hmPhotoData='';Setup.renderHmPhotoZone()">फेरि खिच्नुहोस्</button>`;
    } else {
      zone.innerHTML = `
        <div class="cam-wrap" style="max-width:200px; margin:0 auto;">
          <video id="su-hm-video" autoplay muted playsinline></video>
          <div class="cam-overlay-frame"></div>
        </div>
        <div class="cam-controls" style="margin-top:8px;">
          <button class="btn btn-outline btn-sm" onclick="Cam.flip($('#su-hm-video'))">🔄 क्यामेरा बदल्नुहोस्</button>
          <button class="btn btn-primary btn-sm" onclick="Setup.snapHm()">📸 फोटो खिच्नुहोस्</button>
        </div>`;
      Cam.start($('#su-hm-video'),'user');
    }
  },
  async snapHm(){
    const v = $('#su-hm-video'); if(!v) return;
    this.hmPhotoData = Cam.snap(v);
    Cam.stop();
    this.renderHmPhotoZone();
  },
  next(){
    const name = $('#su-schoolname').value.trim();
    if(!name){ toast('विद्यालयको नाम आवश्यक छ','error'); return; }
    $('.setup-step[data-step="1"]').classList.add('hidden');
    $('.setup-step[data-step="2"]').classList.remove('hidden');
    this.renderHmPhotoZone();
  },
  back(){
    Cam.stop();
    $('.setup-step[data-step="2"]').classList.add('hidden');
    $('.setup-step[data-step="1"]').classList.remove('hidden');
  },
  async finish(){
    const hmName = $('#su-hm-name').value.trim();
    const hmUser = $('#su-hm-username').value.trim();
    const hmPass = $('#su-hm-pass').value;
    if(!hmName || !hmUser || !hmPass){ toast('सबै आवश्यक फिल्ड भर्नुहोस्','error'); return; }
    if(!this.hmPhotoData){ toast('प्रधानाध्यापकको फोटो खिच्नुहोस्','error'); return; }
    Cam.stop();

    const config = Object.assign({}, DEFAULT_CONFIG, {
      schoolName: $('#su-schoolname').value.trim(),
      address: $('#su-address').value.trim(),
      phone: $('#su-phone').value.trim(),
      logo: this.logoData,
      headmasterName: hmName,
      headmasterUsername: hmUser,
      headmasterPass: hmPass,
      headmasterPhoto: this.hmPhotoData,
      setupDone:true,
    });
    await DB.putSetting(config);

    // create headmaster as first user record too, so they appear in staff lists / attendance
    let faceDescriptor = null;
    try{
      await Face.loadModels();
      const img = new Image(); img.src = this.hmPhotoData;
      await new Promise(r=>{ img.onload=r; });
      faceDescriptor = await Face.getDescriptor(img);
    }catch(e){ /* non-blocking */ }

    await DB.addUser({
      role:'headmaster', name:hmName, class:'', section:'', phone:'',
      photo:this.hmPhotoData, faceDescriptor, qrId:uid(), username:hmUser, password:hmPass,
      createdAt: new Date().toISOString(), status:'active'
    });

    toast('प्रणाली सफलतापूर्वक सुरु भयो! अब लगइन गर्नुहोस्','success');
    await loadState();
    App.boot();
  }
};

/* ---------------------------- Auth / Lock screen ---------------------------- */
const Lock = {
  faceMatchTimer:null,
  render(){
    const cfg = State.config;
    $('#lock-school-name').textContent = cfg.schoolName;
    $('#lock-hm-name').textContent = 'प्र.अ. ' + cfg.headmasterName;
    const photoEl = $('#lock-hm-photo');
    photoEl.innerHTML = cfg.headmasterPhoto ? `<img src="${cfg.headmasterPhoto}">` : '🏔️';
    $('#lock-msg').textContent = '';
    if(cfg.faceLockEnabled){
      this.showFace();
    } else {
      this.showPassword();
    }
  },
  showPassword(){
    this.stopFaceLoop();
    $('#lock-face-zone').classList.add('hidden');
    $('#lock-pass-zone').classList.remove('hidden');
    const toggleBtn = $('#lock-face-toggle-btn');
    toggleBtn.classList.toggle('hidden', !State.config.faceLockEnabled);
  },
  async showFace(){
    $('#lock-pass-zone').classList.add('hidden');
    $('#lock-face-zone').classList.remove('hidden');
    const ok = await Cam.start($('#lock-face-video'),'user');
    if(!ok){ this.showPassword(); return; }
    const loaded = await Face.loadModels();
    if(!loaded){ toast('फेस मोडेल लोड हुन सकेन, पासवर्ड प्रयोग गर्नुहोस्','warn'); this.showPassword(); return; }
    this.faceLoop();
  },
  faceLoop(){
    $('#lock-face-status').textContent = 'अनुहार खोजिँदैछ...';
    this.faceMatchTimer = setInterval(async ()=>{
      const v = $('#lock-face-video');
      if(!v || !v.srcObject) return;
      const desc = await Face.getDescriptor(v);
      if(!desc){ return; }
      // match against all users with role headmaster/teacher (staff can unlock too)
      const staff = State.users.filter(u => u.faceDescriptor && (u.role==='headmaster' || u.role==='teacher'));
      let best=null, bestDist=Infinity;
      for(const u of staff){
        const d = Face.distance(desc, u.faceDescriptor);
        if(d < bestDist){ bestDist=d; best=u; }
      }
      if(best && bestDist <= 0.5){
        $('#lock-face-status').textContent = 'चिनियो: ' + best.name;
        this.stopFaceLoop();
        Cam.stop();
        Auth.loginAs(best);
      }
    }, 900);
  },
  stopFaceLoop(){ if(this.faceMatchTimer){ clearInterval(this.faceMatchTimer); this.faceMatchTimer=null; } },
  tryPasswordLogin(){
    const u = $('#lock-username').value.trim();
    const p = $('#lock-password').value;
    const cfg = State.config;
    if(u===cfg.headmasterUsername && p===cfg.headmasterPass){
      const hmUser = State.users.find(x=>x.role==='headmaster') || {role:'headmaster', name:cfg.headmasterName};
      Auth.loginAs(hmUser);
      return;
    }
    const staff = State.users.find(x => x.role==='teacher' && x.username===u && x.password===p);
    if(staff){ Auth.loginAs(staff); return; }
    $('#lock-msg').textContent = 'प्रयोगकर्ता नाम वा पासवर्ड मिलेन।';
  }
};

const Auth = {
  loginAs(user){
    State.currentUser = user;
    Cam.stop();
    Lock.stopFaceLoop();
    toast(`स्वागत छ, ${user.name}!`,'success',2000);
    App.showMain();
  },
  logout(){
    State.currentUser = null;
    Cam.stop();
    App.boot();
  }
};
</script>
<script>
/* ---------------------------- App bootstrap & Router ---------------------------- */
const NAV_ITEMS = [
  {key:'dashboard', label:'ड्यासबोर्ड', icon:'🏠'},
  {key:'attendance', label:'हाजिर', icon:'📷'},
  {key:'people', label:'व्यक्ति', icon:'👥'},
  {key:'reports', label:'रिपोर्ट', icon:'📊'},
  {key:'settings', label:'सेटिङ', icon:'⚙️'},
];

const App = {
  async boot(){
    await loadState();
    Cam.stop(); Lock.stopFaceLoop();
    $('#view-setup').classList.add('hidden');
    $('#view-lock').classList.add('hidden');
    $('#view-main').classList.add('hidden');

    if(!State.config || !State.config.setupDone){
      $('#view-setup').classList.remove('hidden');
      Setup.init();
      return;
    }
    if(!State.currentUser){
      $('#view-lock').classList.remove('hidden');
      Lock.render();
      return;
    }
    this.showMain();
  },
  showMain(){
    $('#view-setup').classList.add('hidden');
    $('#view-lock').classList.add('hidden');
    $('#view-main').classList.remove('hidden');
    const cfg = State.config;
    for(const id of ['#tb-schoolname','#tb-schoolname2']) $(id).textContent = cfg.schoolName;
    for(const id of ['#tb-usertag','#tb-usertag2']) $(id).textContent = `${ROLE_LABEL[State.currentUser.role]||''} • ${State.currentUser.name}`;
    for(const id of ['#tb-logo','#tb-logo2']){ const el = $(id); el.innerHTML = cfg.logo ? `<img src="${cfg.logo}">` : (cfg.schoolName? cfg.schoolName[0]:'वि'); }
    this.renderNav();
    Router.go('dashboard');
  },
  renderNav(){
    const nav = $('#bottom-nav');
    nav.innerHTML = NAV_ITEMS.map(it => `
      <button class="nav-item ${State.route===it.key?'active':''}" onclick="Router.go('${it.key}')">
        <span class="nav-ic">${it.icon}</span><span>${it.label}</span>
      </button>`).join('');
  }
};

const Router = {
  go(route){
    State.route = route;
    App.renderNav();
    Cam.stop();
    const main = $('#main-content');

<script>
/* =========================================================================
   Attendance engine
   Rules (as specified by school):
   - morningStart..morningEnd   -> on-time -> morning='P'  (full)
   - morningEnd..lunchEnd       -> late    -> morning='Half'
   - lunchEnd..eveningStart     -> CLOSED (no marking allowed)
   - eveningStart..eveningEnd   -> evening='P' (marks evening presence)
   - after eveningEnd           -> CLOSED
   Final daily letter combines both:
     morning P + evening P   => 'PP' (double present)
     morning Half + evening P=> 'PP' (counts as full day via both sessions)
     morning P only          => 'P'
     morning Half only       => 'H' (half day)
     evening P only (no AM)  => 'P' (single present)
     nothing marked, working day => 'A' (absent)
     Saturday / declared holiday => 'HOL'
   ========================================================================= */
const Attendance = {
  isHoliday(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    if(State.config.saturdayHoliday && d.getDay()===6) return true;
    return State.holidays.some(h=>h.date===dateStr);
  },
  holidayLabel(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    const custom = State.holidays.find(h=>h.date===dateStr);
    if(custom) return custom.label;
    if(State.config.saturdayHoliday && d.getDay()===6) return 'शनिबार';
    return null;
  },
  currentSlot(now=new Date()){
    const t = State.config.times;
    const mins = nowMinutes(now);
    const mS=timeStrToMinutes(t.morningStart), mE=timeStrToMinutes(t.morningEnd),
          lE=timeStrToMinutes(t.lunchEnd), eS=timeStrToMinutes(t.eveningStart), eE=timeStrToMinutes(t.eveningEnd);
    if(mins>=mS && mins<mE) return {slot:'morning_ontime', label:'बिहानी हाजिर (पूर्ण)'};
    if(mins>=mE && mins<lE) return {slot:'morning_late', label:'ढिलो हाजिर (आधा)'};
    if(mins>=lE && mins<eS) return {slot:'closed_midday', label:'हाजिर बन्द (दिउँसो)'};
    if(mins>=eS && mins<eE) return {slot:'evening', label:'साँझको हाजिर'};
    return {slot:'closed', label:'हाजिर समय बाहिर'};
  },
  finalLetter(rec){
    if(!rec) return null;
    if(rec.holiday) return 'HOL';
    const m = rec.morning, e = rec.evening;
    if(m==='P' && e==='P') return 'PP';
    if(m==='Half' && e==='P') return 'PP';
    if(m==='P') return 'P';
    if(m==='Half') return 'H';
    if(!m && e==='P') return 'P';
    return 'A';
  },
  async markByUser(user, now=new Date()){
    const date = todayStr(now);
    if(this.isHoliday(date)){
      return {ok:false, msg:`आज ${this.holidayLabel(date)} - बिदाको दिन हो, हाजिर आवश्यक छैन।`};
    }
    const slotInfo = this.currentSlot(now);
    let rec = await DB.attendanceByUserDate(user.id, date);
    if(!rec) rec = {userId:user.id, date, morning:null, evening:null, markedAt:{}};

    if(slotInfo.slot==='morning_ontime'){
      if(rec.morning==='P') return {ok:false, msg:'तपाईंको बिहानको हाजिर पहिले नै लागिसक्यो।'};
      rec.morning='P'; rec.markedAt.morning = now.toISOString();
    } else if(slotInfo.slot==='morning_late'){
      if(rec.morning) return {ok:false, msg:'तपाईंको बिहानको हाजिर पहिले नै लागिसक्यो।'};
      rec.morning='Half'; rec.markedAt.morning = now.toISOString();
    } else if(slotInfo.slot==='closed_midday'){
      return {ok:false, msg:'अहिले हाजिर लगाउन मिल्दैन। दिउँसोको समय हो, साँझको हाजिर समयमा फेरि प्रयास गर्नुहोस्।'};
    } else if(slotInfo.slot==='evening'){
      if(rec.evening==='P') return {ok:false, msg:'तपाईंको साँझको हाजिर पहिले नै लागिसक्यो।'};
      rec.evening='P'; rec.markedAt.evening = now.toISOString();
    } else {
      return {ok:false, msg:'हाजिर लगाउने समय समाप्त भयो। सेटिङमा गई समय हेर्नुहोस्।'};
    }
    rec.final = this.finalLetter(rec);
    if(rec.id) await DB.putAttendance(rec); else { const id = await DB.addAttendance(rec); rec.id=id; }
    return {ok:true, msg:`${user.name} — हाजिर सफल भयो! (${slotInfo.label})`, rec, slotInfo};
  }
};
</script>

<script>
/* ---------------------------- Attendance marking view (Face primary + QR) ---------------------------- */
Views.attendance = function(main){
  const cfg = State.config;
  const modeDefault = cfg.faceAttendanceEnabled ? 'face' : (cfg.qrAttendanceEnabled ? 'qr' : 'face');
  main.innerHTML = `
    <div class="card">
      <div class="card-title">हाजिर लगाउनुहोस्</div>
      <div class="card-sub">${Attendance.currentSlot().label} • ${fmtClock()}</div>
      <div class="tabs">
        <button class="tab-btn ${modeDefault==='face'?'active':''}" id="tab-face" onclick="AttendanceUI.switchMode('face')">🙂 फेस डिटेक्सन</button>
        <button class="tab-btn ${modeDefault==='qr'?'active':''}" id="tab-qr" onclick="AttendanceUI.switchMode('qr')">▦ QR स्क्यान</button>
      </div>
      <div id="att-mode-body"></div>
    </div>
    <div class="card">
      <div class="card-title">भर्खरै लागेको हाजिर</div>
      <div id="att-recent"></div>
    </div>
  `;
  AttendanceUI.init(modeDefault);
};

const AttendanceUI = {
  mode:'face', faceTimer:null, qrScanner:null, recent:[], busy:false,

  async init(mode){
    this.recent = [];
    await this.switchMode(mode);
    this.renderRecent();
  },

  async switchMode(mode){
    this.stopAll();
    this.mode = mode;
    $('#tab-face').classList.toggle('active', mode==='face');
    $('#tab-qr').classList.toggle('active', mode==='qr');
    const body = $('#att-mode-body');
    if(mode==='face'){
      body.innerHTML = `
        <div class="cam-wrap" style="max-width:360px;margin:0 auto;">
          <video id="att-face-video" autoplay muted playsinline></video>
          <div class="cam-overlay-frame" style="border-radius:50%; inset:8%;"></div>
          <div class="cam-status"><span id="att-face-status">क्यामेरा सुरु हुँदैछ...</span></div>
        </div>
        <div class="cam-controls" style="margin-top:10px;">
          <button class="btn btn-outline btn-sm" onclick="AttendanceUI.flipCam()">🔄 क्यामेरा बदल्नुहोस् (अगाडि/पछाडि)</button>
        </div>`;
      const ok = await Cam.start($('#att-face-video'),'user');
      if(!ok) return;
      const loaded = await Face.loadModels();
      if(!loaded){ $('#att-face-status').textContent = 'फेस मोडेल लोड भएन'; toast('फेस डिटेक्सन मोडेल लोड हुन सकेन, QR प्रयोग गर्नुहोस्','warn'); return; }
      $('#att-face-status').textContent = 'अनुहार खोजिँदैछ...';
      this.faceTimer = setInterval(()=>this.faceTick(), 800);
    } else {
      body.innerHTML = `<div id="att-qr-reader" style="max-width:360px;margin:0 auto;"></div>
        <div class="cam-controls" style="margin-top:10px;">
          <button class="btn btn-outline btn-sm" onclick="AttendanceUI.flipQr()">🔄 क्यामेरा बदल्नुहोस् (अगाडि/पछाडि)</button>
        </div>
        <p class="hint" style="text-align:center;">विद्यार्थी/शिक्षकको परिचय-पत्रको QR कोड क्यामेरा अगाडि देखाउनुहोस्।</p>`;
      this.qrFacing = 'environment';
      this.qrScanner = new Html5Qrcode('att-qr-reader');
      try{
        await this.qrScanner.start({facingMode:this.qrFacing}, {fps:10, qrbox:220}, (text)=>this.onQrHit(text), ()=>{});
      }catch(e){ toast('QR क्यामेरा सुरु हुन सकेन','error'); }
    }
  },

  async flipCam(){ await Cam.flip($('#att-face-video')); },
  async flipQr(){
    if(!this.qrScanner) return;
    try{ await this.qrScanner.stop(); await this.qrScanner.clear(); }catch(e){}
    this.qrFacing = this.qrFacing==='environment' ? 'user' : 'environment';
    this.qrScanner = new Html5Qrcode('att-qr-reader');
    try{ await this.qrScanner.start({facingMode:this.qrFacing}, {fps:10, qrbox:220}, (text)=>this.onQrHit(text), ()=>{}); }catch(e){}
  },

  async faceTick(){
    if(this.busy) return;
    const v = $('#att-face-video'); if(!v || !v.srcObject) return;
    const desc = await Face.getDescriptor(v);
    if(!desc){ $('#att-face-status').textContent = 'अनुहार खोजिँदैछ...'; return; }
    const known = State.users.filter(u=>u.faceDescriptor && u.status!=='inactive');
    let best=null, bestDist=Infinity;
    for(const u of known){ const d = Face.distance(desc,u.faceDescriptor); if(d<bestDist){bestDist=d;best=u;} }
    if(best && bestDist<=0.5){
      this.busy = true;
      $('#att-face-status').textContent = 'चिनियो: ' + best.name;
      const res = await Attendance.markByUser(best);
      this.pushRecent(best, res);
      toast(res.msg, res.ok?'success':'warn');
      setTimeout(()=>{ this.busy=false; if($('#att-face-status')) $('#att-face-status').textContent='अनुहार खोजिँदैछ...'; }, 2500);
    } else {
      $('#att-face-status').textContent = 'चिनिएन — दर्ता जाँच्नुहोस्';
    }
  },

  async onQrHit(text){
    if(this.busy) return;
    const user = await DB.userByQr(text.trim());
    if(!user){ toast('अमान्य QR कोड — यो प्रयोगकर्ता फेला परेन','error'); return; }
    this.busy = true;
    const res = await Attendance.markByUser(user);
    this.pushRecent(user, res);
    toast(res.msg, res.ok?'success':'warn');
    setTimeout(()=>{ this.busy=false; }, 1800);
  },

  pushRecent(user,res){
    this.recent.unshift({user,res,time:fmtClock()});
    this.recent = this.recent.slice(0,10);
    this.renderRecent();
  },
  renderRecent(){
    const el = $('#att-recent'); if(!el) return;
    if(this.recent.length===0){ el.innerHTML = `<div class="empty-state" style="padding:20px;">अझै हाजिर लागेको छैन</div>`; return; }
    el.innerHTML = this.recent.map(r=>`
      <div class="list-row">
        <div class="avatar">${r.user.photo?`<img src="${r.user.photo}">`:(r.user.name?r.user.name[0]:'?')}</div>
        <div class="list-main"><div class="lname">${r.user.name}</div><div class="lsub">${r.time} • ${ROLE_LABEL[r.user.role]}</div></div>
        ${r.res.ok ? `<span class="badge badge-pine">सफल</span>` : `<span class="badge badge-rose">असफल</span>`}
      </div>`).join('');
  },
  stopAll(){
    if(this.faceTimer){ clearInterval(this.faceTimer); this.faceTimer=null; }
    Cam.stop();
    if(this.qrScanner){ try{ this.qrScanner.stop().then(()=>this.qrScanner.clear()); }catch(e){} this.qrScanner=null; }
  }
};
</script>

  },

  classOptions(selected){

  },
  sectionOptions(className, selected){
    const c = State.config.classes.find(x=>x.name===className);
    const secs = c ? c.sections : [];
    return secs.map(s=>`<option value="${s}" ${s===selected?'selected':''}>${s}</option>`).join('');

  async openForm(userId){

      <div class="field">

        </select>
      </div>
      <div class="field"><label>पूरा नाम *</label><input type="text" id="pf-name" value="${u.name||''}"></div>
      <div id="pf-class-wrap" class="field-row">
